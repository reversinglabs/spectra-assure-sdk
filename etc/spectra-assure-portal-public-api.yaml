        - Zed License
        - Zend License v2.0
        - Zimbra Public License v1.3
        - Zimbra Public License v1.4
        - zlib License
        - zlib/libpng License with Acknowledgement
        - Zope Public License 1.1
        - Zope Public License 2.0
        - Zope Public License 2.1
    SoftwarePlatform:
      description: >-
        Underlying technology or framework that the software has been developed
        to run on.
      type: string
      enum:
        - Other
        - Windows
        - Linux
        - MacOS
        - Containers
        - Browser
        - Mobile
        - AI
    SoftwarePlatformArchitecture:
      description: >-
        Platform-specific architecture. Valid values depend on the software
        platform.
      type: string
      default: Generic
      enum:
        - Generic
        - x86
        - x64
        - ARM64
        - ARM64EC
        - ARM32
        - Universal
        - Apple Silicon
        - MIPS
        - PowerPC
        - RISC-V
        - LLM
        - SLM
        - Multimodal
        - Neural Network
        - Decision Tree
        - Skills
        - Agents
        - WebKit
        - Chromium
        - Gecko
    UUID:
      type: string
      description: Automatically generated unique identifier.
      format: uuid
    Date:
      type: string
      format: date
      example: '2025-01-20'
    DateTime:
      type: string
      format: date-time
      example: '2022-07-15T13:57:39.843631Z'
    Messages:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    SoftwareInfo:
      type: object
      required:
        - product
        - version
        - publisher
        - category
        - license
        - platform
        - release_date
      properties:
        product:
          type: string
          nullable: true
          example: Inno Setup
        version:
          type: string
          example: 5.5.8
        publisher:
          type: string
          nullable: true
          example: jrsoftware.org
          default: Unknown
        category:
          type: string
          example: Other
          default: Other
        license:
          type: string
          example: Unknown
          default: Unknown
        platform:
          type: string
          example: Windows
          default: Other
        release_date:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
    ApprovalStatusDisplay:
      type: string
      description: Approval status for the requested package version.
      enum:
        - Undetermined
        - Approved
        - ApprovalRejected
        - ApprovalRevoked
    OrganizationRole:
      type: string
      enum:
        - RlSupport
        - OrganizationAdmin
        - OrganizationMember
        - Security
        - TrialOrganizationMember
      example: OrganizationMember
      default: OrganizationMember
    GroupRole:
      type: string
      enum:
        - GroupOwner
        - GroupMember
        - TrialGroupMember
      example: GroupOwner
      default: GroupMember
    ApprovalStatusInformation:
      type: object
      required:
        - reason
        - user
        - role
        - timestamp
      properties:
        reason:
          description: >-
            Reason for the current approval status of the requested package
            version. This information is provided for auditing purposes.
          type: string
          example: Rejected because of valid reasons
        timestamp:
          $ref: '#/components/schemas/DateTime'
        user:
          description: >-
            Name of the user who set the current approval status for the
            requested package version. This information is provided for auditing
            purposes.
          type: string
          example: user@foo.bar
          nullable: true
        role:
          oneOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - $ref: '#/components/schemas/GroupRole'
          example: GroupOwner
          nullable: true
          description: >-
            Current role of the user who set the approval status for the
            requested package version. This role is not necessarily the same as
            it was when the approval status was set.
    AuditFilterCondition:
      type: object
      required:
        - filter_by
        - operation
        - values
      description: A single filter condition applied to one audit log field.
      properties:
        filter_by:
          type: string
          description: >-
            The field to filter the audit logs by. A list of supported actions
            can be found in the [Audit
            guide](https://docs.secure.software/portal/audit#supported-actions).
          enum:
            - action
            - outcome
            - auth_context
            - group_id
            - project_name
            - package_name
            - resource_name
            - resource_type
            - user_email
        operation:
          type: string
          description: >
            The comparison operator. Allowed operators depend on the `filter_by`
            field: with `action`, all four operators can be used; with
            `group_id`, only `is` and `is_any` can be used; all other fields
            allow only `is`. `is` / `is_not` use only the first value.
          enum:
            - is
            - is_not
            - is_any
            - is_not_any
        values:
          type: array
          minItems: 1
          description: >-
            One or more filter values. When the operators `is` and `is_not` are
            used, only the first value is taken into account, while the rest are
            ignored.
          items:
            type: string
      example:
        filter_by: action
        operation: is_any
        values:
          - package.created
          - package.deleted
    CreateExportJobRequest:
      type: object
      description: >-
        At least one of `should_create_cef` and `should_create_ndjson` must be
        true.
      required:
        - name
        - should_create_cef
        - should_create_ndjson
        - datetime_start
        - datetime_end
      properties:
        name:
          type: string
          description: >-
            Name of the export. Special characters `\/:*?"<>|` are not
            supported.
          maxLength: 255
          example: April audit export
        filters:
          type: array
          default: []
          description: >-
            List of filter conditions to apply to the contents of the audit log.
            Each field may appear only once in a filter, since all conditions
            are applied together.
          items:
            $ref: '#/components/schemas/AuditFilterCondition'
        should_create_cef:
          type: boolean
          description: Generate a CEF export file.
        should_create_ndjson:
          type: boolean
          description: Generate an NDJSON export file.
        datetime_start:
          type: string
          format: date-time
          description: >-
            Start of the time range (inclusive) for the events in the audit log.
            Must be earlier than `datetime_end` and not older than 365 days.
          example: '2025-01-01T00:00:00Z'
        datetime_end:
          type: string
          format: date-time
          description: >-
            End of the time range (exclusive) for the events in the audit log.
            This value can be up to **365 days** after `datetime_start`.
          example: '2025-04-01T00:00:00Z'
    ExportJob:
      type: object
      required:
        - id
        - name
        - cef_status
        - cef_presigned_url
        - cef_expires_at
        - ndjson_status
        - ndjson_presigned_url
        - ndjson_expires_at
      properties:
        id:
          description: Unique ID of the log export job.
          type: string
          format: uuid
          readOnly: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          description: Name of the exported audit log.
          type: string
          example: April audit export
        cef_status:
          type: string
          enum:
            - IN_PROGRESS
            - DONE
            - FAILED
            - NOT_SELECTED
          description: >-
            Current status of the CEF export. This field returns `NOT_SELECTED`
            when the CEF log format was not requested.
          example: DONE
        cef_presigned_url:
          type: string
          format: uri
          nullable: true
          description: >-
            S3 presigned download URL for the CEF export. This field returns
            `null` until `cef_status` is `DONE`.
          example: https://s3.example.com/exports/audit.cef?X-Amz-Signature=...
        cef_expires_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            UTC datetime after which the CEF presigned URL is no longer valid
            and the exported log becomes unavailable. This field returns `null`
            while the export is in progress or if the CEF log format was not
            requested.
          example: '2025-04-24T10:00:00Z'
        ndjson_status:
          type: string
          enum:
            - IN_PROGRESS
            - DONE
            - FAILED
            - NOT_SELECTED
          description: >-
            Current status of the NDJSON export. This field returns
            `NOT_SELECTED` when the NDJSON log format was not requested.
          example: IN_PROGRESS
        ndjson_presigned_url:
          type: string
          format: uri
          nullable: true
          description: >-
            S3 presigned download URL for the NDJSON export. This field returns
            `null` until `ndjson_status` is `DONE`.
          example: null
        ndjson_expires_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            UTC datetime after which the NDJSON presigned URL is no longer valid
            and the exported log becomes unavailable. This field returns `null`
            while the export in progress or if the NDJSON log format was not
            requested.
          example: '2025-04-24T10:00:00Z'
    DiffWithVersion:
      type: string
      example: 1.1.0
      description: >-
        Name of the package version that will be compared to the version you're
        uploading. This version is treated as the predecessor and displayed in
        the diff section of the report as the 'Referential File'.
    GroupName:
      description: Group name as created and displayed in the Portal.
      type: string
      example: My group
    UserName:
      type: string
      description: >-
        Unique email of the user. Required unless an email is provided in
        `emails`.
    UserActive:
      type: boolean
      description: Administrative status of the user.
    UserEmails:
      type: array
      description: Email addresses associated with the user.
      items:
        $ref: '#/components/schemas/MultiValuedAttributes'
    FamilyName:
      type: string
      description: Last name of the user.
      example: Smith
    GivenName:
      type: string
      description: First name of the user.
      example: John
    AssessmentWithViolations:
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - properties:
            violations:
              $ref: '#/components/schemas/Violations'
    ExternalCatalogLink:
      type: object
      description: >-
        The external catalog stream the package was imported from. `null` if the
        package was not imported from a catalog.
      required:
        - catalog
        - software_id
        - platform
        - architecture
        - stream
        - automatic_sync
        - last_synced_on
      properties:
        catalog:
          type: string
          description: Identifier of the external catalog, for example `reversinglabs`.
          example: reversinglabs
        software_id:
          type: string
          description: The `id` of the software entry in the external catalog document.
          example: RL00042
        platform:
          type: string
          description: Platform of the linked artifact stream.
          example: Windows
        architecture:
          type: string
          description: Architecture of the linked artifact stream.
          example: x64
        stream:
          type: string
          description: >-
            Identifier of the linked stream, one of the software entry's
            `streams` in the catalog document.
          example: RL00042-Se95b70bb
        automatic_sync:
          type: boolean
          description: >-
            Whether new versions are imported automatically after each Portal
            update.
        last_synced_on:
          nullable: true
          description: When versions were last imported from the catalog into this package.
          allOf:
            - $ref: '#/components/schemas/DateTime'
    ExternalCatalogDocument:
      type: object
      description: >-
        An external software catalog. Only the properties needed for importing
        are documented; the document may contain others.
      additionalProperties: true
      required:
        - software
      properties:
        display_name:
          type: string
          example: ReversingLabs
        software:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - id
              - versions
            properties:
              id:
                type: string
                description: >-
                  Identifier of the software entry, the `software_id` the import
                  endpoint takes.
                example: RL00042
              name:
                type: string
                example: 7-Zip
              publisher:
                type: string
                nullable: true
                example: Igor Pavlov
              category:
                type: string
                nullable: true
                example: Compression
              streams:
                type: array
                description: >-
                  The software's artifact streams. An imported package follows
                  exactly one of them.
                items:
                  type: object
                  additionalProperties: true
                  required:
                    - id
                  properties:
                    id:
                      type: string
                      description: Stream identifier, the `stream` of every artifact in it.
                      example: RL00042-Se95b70bb
                    format:
                      type: string
                      example: exe
                    platform:
                      type: string
                      example: Windows
                    architecture:
                      type: string
                      example: x64
                    will_receive_updates:
                      type: boolean
                      description: Whether the catalog still adds versions to this stream.
              versions:
                type: array
                description: Versions of the software, newest first.
                items:
                  type: object
                  additionalProperties: true
                  required:
                    - version
                    - artifacts
                  properties:
                    version:
                      type: string
                      description: >-
                        Catalog version string, as accepted in the `versions` of
                        the import endpoints.
                      example: '24.08'
                    artifacts:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                        properties:
                          product:
                            type: string
                            description: File name of the artifact.
                            example: 7z2408-x64.exe
                          platform:
                            type: string
                            example: Windows
                          architecture:
                            type: string
                            example: x64
                          stream:
                            type: string
                            description: Identifier of the stream the artifact belongs to.
                            example: RL00042-Se95b70bb
                          size:
                            type: integer
                            nullable: true
                          released:
                            type: string
                            nullable: true
                          previous:
                            type: string
                            nullable: true
                            description: >-
                              Version string of the preceding version in this
                              stream.
    CatalogImportRequest:
      type: object
      required:
        - software_id
        - stream
      properties:
        software_id:
          type: string
          maxLength: 200
          description: The `id` of the software entry in the catalog document.
          example: RL00042
        stream:
          type: string
          maxLength: 200
          description: >-
            The `id` of the stream to import, one of the software entry's
            `streams`.
          example: RL00042-Swindows-x64-exe
        versions:
          type: array
          items:
            type: string
          description: >-
            Catalog versions to import, at most 16; duplicates are ignored. Omit
            or leave empty to import the stream's newest versions.
          example:
            - '24.07'
            - '24.08'
        auto_sync:
          type: boolean
          default: false
          description: >-
            Import new versions from the catalog automatically after each Portal
            update. While it is on, the catalog update endpoint is refused.
        project_description:
          type: string
          maxLength: 500
          description: Description for the project when this request creates it.
        package_description:
          type: string
          maxLength: 500
          description: >-
            Brief description of the package. Defaults to the catalog entry's
            summary.
        notify_on_completion:
          type: boolean
          default: false
          description: Email you when all imported versions are analyzed.
    CatalogUpdateRequest:
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
          description: >-
            Catalog versions to import, at most 16; duplicates are ignored. Omit
            or leave empty to import all versions newer than the package's
            newest one.
          example:
            - '24.09'
        notify_on_completion:
          type: boolean
          default: false
          description: Email you when all imported versions are analyzed.
    CatalogImportResult:
      type: object
      required:
        - project_id
        - package_id
        - imported_versions
      properties:
        project_id:
          $ref: '#/components/schemas/UUID'
        package_id:
          $ref: '#/components/schemas/UUID'
        imported_versions:
          type: array
          items:
            type: string
          description: >-
            Versions imported by this request, oldest first. Empty when the
            package was already up to date.
          example:
            - '24.07'
            - '24.08'
    CatalogPackage:
      type: object
      description: A package published in a group's software catalog.
      required:
        - project_name
        - project_id
        - package_name
        - package_id
        - description
        - external_catalog
      properties:
        project_name:
          type: string
          example: 7zip
        project_id:
          $ref: '#/components/schemas/UUID'
        package_name:
          type: string
          example: 7zip-windows
        package_id:
          $ref: '#/components/schemas/UUID'
        description:
          type: string
          nullable: true
          description: Brief description of the package, shown on its catalog card.
          example: 7-Zip file archiver for Windows x64.
        external_catalog:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExternalCatalogLink'
    ProfileExport:
      type: object
      required:
        - rl-profile
      properties:
        rl-profile:
          type: object
          required:
            - schema
            - name
            - info
            - timestamp
            - configuration
          properties:
            schema:
              type: integer
              example: 1
            name:
              type: string
              example: Profile
            info:
              type: string
              example: >-
                Profile exported from Spectra Assure Portal: Example Org /
                Example Group
            timestamp:
              type: string
              format: date-time
            configuration:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: object
                  required:
                    - rl_scan_level
                    - rl_auto_approval
                    - overrides
                    - min_catalogue
                  properties:
                    rl_scan_level:
                      type: integer
                      nullable: true
                      minimum: 0
                      maximum: 5
                      description: >-
                        RL-SAFE level. `null` when the level is inherited from
                        the organization.
                    rl_auto_approval:
                      type: boolean
                    min_catalogue:
                      type: integer
                      description: >-
                        Version of the policy catalogue the profile was exported
                        with.
                    overrides:
                      type: object
                      description: Policy overrides keyed by policy ID.
                      additionalProperties:
                        type: object
                        required:
                          - enabled
                          - blocker
                          - audit
                          - apply_to
                        properties:
                          enabled:
                            type: boolean
                          blocker:
                            type: string
                            enum:
                              - pass
                              - fail
                          audit:
                            type: object
                            required:
                              - reason
                              - author
                              - timestamp
                            properties:
                              reason:
                                type: string
                              author:
                                type: string
                              timestamp:
                                type: string
                                format: date-time
                          apply_to:
                            type: array
                            items:
                              type: string
                              enum:
                                - group
                                - organization
    uuid:
      type: string
      description: >-
        Unique, user-provided search identifier tied to each search query. The
        server returns this identifier in the response.
      example: 12-01
    communities:
      type: string
      enum:
        - npm
        - pypi
        - gem
        - nuget
        - vsx
        - psgallery
        - maven
        - clawhub
      description: >-
        Open source community identifier of the software repository that hosts
        the requested software package. Must match one of the [software
        repositories](https://docs.secure.software/community/#supported-communities)
        supported by Spectra Assure Community.
      example: npm
    identity:
      type: object
      required:
        - purl
        - community
        - namespace
        - package
        - product
        - version
        - artifact
        - license
        - published
        - deprecated
        - removed
        - category
        - homepage
        - repository
        - description
      properties:
        purl:
          type: string
          description: >-
            Fully qualified software package URL (including the artifact
            reference).
          example: pkg:npm/mock_react@19.0.0
        community:
          $ref: '#/components/schemas/communities'
        namespace:
          type: string
          description: >-
            Namespace of the software package (according to the purl schema
            pkg:community/namespace/package@version?artifact=filename.ext).
          example: ''
        package:
          type: string
          description: >-
            Name of the software package (according to the purl schema
            pkg:community/namespace/package@version?artifact=filename.ext).
          example: mock_react
        product:
          type: string
          description: Product name as declared by the publisher.
          example: Mock React
        version:
          type: string
          nullable: true
          description: >-
            Version of the software package (according to the purl schema
            pkg:community/namespace/package@version?artifact=filename.ext).
          example: 19.0.0
        artifact:
          type: string
          nullable: true
          description: >-
            Artifact file name (according to the purl schema
            pkg:community/namespace/package@version?artifact=filename.ext).
          example: ''
        license:
          type: string
          description: >-
            Package license as the SPDX license expression. The format is
            ReversingLabs-specific: LicenseFamily (SPDX-expression).
          example: MIT
        published:
          type: string
          description: Package version publication date as ISO-8601 string.
          example: 2024-12-05T18:10:21+0000
        deprecated:
          type: boolean
          nullable: true
          description: >-
            Indicates if the version has been deprecated. Can be null if
            information is not available.
          example: false
        removed:
          type: boolean
          description: Indicates if the version has been removed.
          example: false
        category:
          type: string
          nullable: true
          description: >-
            Indicates the software category for the package version. Can be null
            if information is not available.
          example: ''
        homepage:
          type: string
          description: Package homepage or related website.
          example: www.example.com
        repository:
          type: string
          description: Source code related to the package.
          example: https://github.com/facebook/react
        description:
          type: string
          description: Package description as declared by the publisher.
          example: Mock React package for testing purposes.
        keywords:
          type: array
          description: Keywords associated with the software package.
    impl_quality:
      type: object
      required:
        - status
        - priority
        - assessment
      properties:
        status:
          type: string
          enum:
            - fail
            - warning
            - pass
          description: Overall package risk assessment evaluation result/status.
        priority:
          type: integer
          description: >-
            Highest priority issue within the software package. Range from P0
            (highest) to P4 (lowest). Optional.
          nullable: true
        assessment:
          type: string
          description: Overall package deployment risk.
        metrics:
          type: object
          description: Software quality metrics.
          required:
            - high
            - medium
            - low
          properties:
            high:
              type: integer
              description: >-
                Total number of policy violations with high severity on
                components.
            medium:
              type: integer
              description: >-
                Total number of policy violations with medium severity on
                components.
            low:
              type: integer
              description: >-
                Total number of policy violations with low severity on
                components.
    hashes:
      type: array
      items:
        type: string
    impl_artifacts:
      type: array
      items:
        type: object
        description: Artifacts related to the package version.
        required:
          - type
          - hashes
          - ref
        properties:
          type:
            type: string
            enum:
              - linked-package
              - rl-sbom-cyclonedx
              - rl-sbom-spdx
              - rl-safe
            example: linked-package
            description: >-
              Package artifact type. Linked packages are found in the package
              repository. ReversingLabs (rl) packages are Spectra Assure
              generated artifacts. They might not be available for all packages
              or package versions.
          hashes:
            type: array
            items:
              $ref: '#/components/schemas/hashes'
          ref:
            type: string
            description: >-
              Package artifact reference. Linked packages use file names as
              references.
            example: mock-1.22.4-.tar.gz'
    base_assessment:
      type: object
      required:
        - final
        - enabled
        - priority
        - label
        - violations
        - count
      properties:
        final:
          type: boolean
          description: Risk is considered deciding when the final value is set to true.
        enabled:
          type: boolean
          description: >-
            Indicates that the risk assessment was performed during analysis.
            Spectra Assure license determines which risk assessments are
            performed.
        priority:
          type: integer
          description: >-
            Highest priority issue within the software package. Range from P0
            (highest) to P4 (lowest). Optional.
          nullable: true
        label:
          type: string
          description: Risk assessment label to be displayed to the user.
        violations:
          type: array
          description: Policy violations that have caused the reported risk.
          items:
            type: string
        count:
          type: integer
          description: Number of risk associated with the risk label.
    impl_assessment:
      allOf:
        - $ref: '#/components/schemas/base_assessment'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - fail
                - warning
                - pass
              description: Risk assessment evaluation result/status.
    repo_assessment:
      allOf:
        - $ref: '#/components/schemas/base_assessment'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - fail
                - warning
                - pass
                - pending
              description: Risk assessment evaluation result/status.
    assessments:
      type: object
      oneOf:
        - type: object
          required:
            - licenses
            - malware
            - hardening
            - secrets
            - tampering
            - vulnerabilities
          properties:
            licenses:
              $ref: '#/components/schemas/impl_assessment'
            malware:
              $ref: '#/components/schemas/impl_assessment'
            hardening:
              $ref: '#/components/schemas/impl_assessment'
            secrets:
              $ref: '#/components/schemas/impl_assessment'
            tampering:
              $ref: '#/components/schemas/impl_assessment'
            vulnerabilities:
              $ref: '#/components/schemas/impl_assessment'
            repository:
              $ref: '#/components/schemas/repo_assessment'
        - type: object
          required:
            - repository
          properties:
            repository:
              $ref: '#/components/schemas/repo_assessment'
          additionalProperties: false
    incidents:
      type: object
      additionalProperties:
        type: object
        required:
          - type
          - reporters
        properties:
          type:
            type: string
            enum:
              - malware
              - removal
            description: Describes the type of the incident.
          reporters:
            type: array
            items:
              type: object
              required:
                - type
                - name
                - date
                - link
              properties:
                type:
                  type: string
                  enum:
                    - rl-analyst
                    - rl-scanner
                    - community
                  description: >-
                    Incident reporter. Differentiates between analysts,
                    automated reporting, and community contributions.
                name:
                  type: string
                  description: >-
                    Incident reporter name. Name is displayed to the user within
                    the UI.
                date:
                  type: string
                  description: Incident date as ISO-8601 string.
                link:
                  type: string
                  description: >-
                    Link to a resource that contains more information on the
                    incident. Value is optional.
    impl_versions:
      type: array
      items:
        type: object
        description: List of package versions and their most important details.
        required:
          - version
          - published
          - incidents
        properties:
          version:
            type: string
            description: Package version.
            example: 19.0.0
          published:
            type: string
            description: Package version publication date as ISO-8601 string.
            example: 2024-12-05T18:10:21+0000
          quality:
            $ref: '#/components/schemas/impl_quality'
          artifacts:
            $ref: '#/components/schemas/impl_artifacts'
          assessments:
            $ref: '#/components/schemas/assessments'
          incidents:
            $ref: '#/components/schemas/incidents'
    impl_incidents:
      type: object
      description: Statistics for incidents reported for any package version.
      required:
        - malware
        - recent_malware
        - removal
        - recent_removal
      properties:
        malware:
          type: integer
          description: Total number of malware incidents reported for the package.
          example: 0
        recent_malware:
          type: object
          description: Describes malware incidents.
          required:
            - latest_version
            - latest_timestamp
            - recent_count
          properties:
            latest_version:
              type: string
              description: The latest malware package version.
            latest_timestamp:
              type: string
              description: >-
                The time when the latest malware version was published as
                ISO-8601 string.
            recent_count:
              type: integer
              description: The number of malware incidents in the last two years.
        removal:
          type: integer
          description: Total number of removal incidents reported for the package.
          example: 1
        recent_removal:
          type: object
          description: Describes removal incidents.
          required:
            - latest_version
            - latest_timestamp
            - recent_count
          properties:
            latest_version:
              type: string
              description: The latest removed package version.
              example: 1.2.0rc1
            latest_timestamp:
              type: string
              description: >-
                The time when the latest package removal occurred as ISO-8601
                string.
              example: 2020-05-14T11:25:54+0000
            recent_count:
              type: integer
              description: The number of removal incidents in the last two years.
              example: 0
    impl_quarantine:
      type: object
      properties:
        reason:
          type: string
          enum:
            - rl-analyst
            - rl-scanner
            - rl-heuristics
            - ai-analysis
            - community
          description: Reason why the package has been put in quarantine.
        started_on:
          type: string
          description: Quarantine period starting date as ISO-8601 string.
        expires_on:
          type: string
          description: >-
            Quarantine period expiration date as ISO-8601 string. Quarantine is
            perpetual if there is no expiration date.
          nullable: true
        expired:
          type: boolean
          description: >-
            Quarantine period has ended. ReversingLabs continuously evaluates
            new and quarantined packages, and updates quarantine as necessary.
    package:
      type: object
      description: Software package metadata.
      required:
        - owner_verified
        - is_quarantined
        - first_published
        - total_versions
        - total_installs
        - total_downloads
        - latest_version
        - direct_imports
        - all_malicious
        - was_archived
        - was_removed
        - key_project
        - popularity
        - identity
        - versions
        - incidents
        - quarantine
      properties:
        owner_verified:
          type: boolean
          description: >-
            Indicates that package ownership was verified by the package
            repository.
          example: false
        is_quarantined:
          type: boolean
          description: >-
            Indicates that the package may be quarantined in the package
            repository.
          nullable: true
        first_published:
          type: string
          description: Initial package publication date as ISO-8601 string.
          example: 2022-04-26T18:40:14+0000
        total_versions:
          type: integer
          description: Total number of currently published package/extension versions.
          example: 7
        total_installs:
          type: integer
          description: >-
            Total number of package/extension installations as tracked by the
            package repository.
          nullable: true
        total_downloads:
          type: integer
          description: >-
            Total number of package/extension downloads as tracked by the
            package repository.
          nullable: true
          example: 6231
        latest_version:
          type: string
          description: Latest published package version.
          example: 7.0.0
        direct_imports:
          type: integer
          description: >-
            Total number of other packages in the repository that directly
            import this one.
          nullable: true
          example: 312
        all_malicious:
          type: boolean
          description: >-
            Indicates that currently all package versions are reported as
            malware.
          example: false
        was_archived:
          type: boolean
          description: >-
            Indicates that the package may be archived in the package
            repository.
          nullable: true
        was_removed:
          type: boolean
          description: >-
            Indicates that the package was completely removed from the package
            repository.
          example: false
        key_project:
          type: boolean
          description: >-
            Indicates that the package is considered to be a key project in the
            community.
          example: false
        popularity:
          type: integer
          enum:
            - 10
            - 100
            - 1000
            - 10000
          description: Package ranking in the community based on the number of downloads.
          example: 1000
          nullable: true
        identity:
          $ref: '#/components/schemas/identity'
        versions:
          $ref: '#/components/schemas/impl_versions'
        incidents:
          $ref: '#/components/schemas/impl_incidents'
        quarantine:
          $ref: '#/components/schemas/impl_quarantine'
    oss-search:
      type: object
      required:
        - community
      properties:
        community:
          type: object
          description: Results of a Spectra Assure Community search.
          required:
            - packages
          properties:
            packages:
              type: array
              description: >-
                One or more software packages that match the search criteria
                from the request.
              items:
                required:
                  - uuid
                  - package
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  package:
                    $ref: '#/components/schemas/package'
            errors:
              type: array
              items:
                required:
                  - uuid
                  - error
                properties:
                  uuid:
                    $ref: '#/components/schemas/uuid'
                  error:
                    type: object
                    description: Package lookup error information.
                    required:
                      - code
                      - info
                    properties:
                      code:
                        type: integer
                        description: Package lookup HTTP error code.
                      info:
                        type: string
                        description: Package lookup HTTP error code description.
    oss-error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    file:
      type: object
      description: Details about the software package file.
      required:
        - name
        - size
        - source_url
        - downloaded
        - hashes
      properties:
        name:
          type: string
          description: Package artifact file name.
        size:
          type: integer
          description: Package artifact size in bytes.
          nullable: true
        source_url:
          type: string
          description: Location of the package artifact in the remote repository.
        downloaded:
          type: boolean
          description: >-
            Indicates that the package has been successfully downloaded from the
            repository.
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/hashes'
        identity:
          $ref: '#/components/schemas/identity'
    license:
      type: object
      description: Discovered license statistics.
      required:
        - undeclared
        - public_domain
        - permissive
        - weak_copyleft
        - copyleft
        - freeware
        - shareware
        - freemium
        - non_commercial
        - proprietary
      properties:
        undeclared:
          type: integer
          description: >-
            Number of software components and dependencies without a declared
            license.
        public_domain:
          type: integer
          description: Number of public domain software licenses.
        permissive:
          type: integer
          description: Number of permissive software licenses.
        weak_copyleft:
          type: integer
          description: Number of weak copyleft software licenses.
        copyleft:
          type: integer
          description: Number of copyleft software licenses.
        freeware:
          type: integer
          description: Number of freeware software licenses.
        shareware:
          type: integer
          description: Number of shareware software licenses.
        freemium:
          type: integer
          description: Number of freemium software licenses.
        non_commercial:
          type: integer
          description: Number of non-commercial software licenses.
        proprietary:
          type: integer
          description: Number of proprietary software licenses.
    vulnerabilities:
      type: object
      description: Discovered vulnerability statistics.
      properties:
        total:
          type: integer
          description: Total number of detected vulnerabilities.
        critical:
          type: integer
          description: Total number of critical severity vulnerabilities.
        high:
          type: integer
          description: Total number of high severity vulnerabilities.
        medium:
          type: integer
          description: Total number of medium severity vulnerabilities.
        low:
          type: integer
          description: Total number of low severity vulnerabilities.
        exploit:
          type: integer
          description: Number of vulnerabilities that have a known exploit.
        malware:
          type: integer
          description: Number of vulnerabilities that are exploited by malware.
        mandate:
          type: integer
          description: Number of vulnerabilities that are patching-mandated.
        fixable:
          type: integer
          description: >-
            Number of vulnerabilities that can be resolved by a package version
            update.
        named:
          type: integer
          description: Number of vulnerabilities that have distinguished marketing names.
    quality:
      type: object
      description: Overall software quality metrics.
      required:
        - status
        - priority
        - metrics
      properties:
        status:
          type: string
          enum:
            - fail
            - pass
          description: Overall software package policy evaluation result.
        priority:
          type: integer
          description: >-
            Highest priority issue within the software package. Range from P0
            (highest) to P4 (lowest).
        metrics:
          type: object
          description: Software quality metrics.
          required:
            - total
            - pass
            - warning
            - fail
            - high
            - medium
            - low
          properties:
            total:
              type: integer
              description: Total number of policy violations on components.
            pass:
              type: integer
              description: Total number of policy violations that passed on components.
            warning:
              type: integer
              description: >-
                Total number of policy violations that caused a warning on
                components.
            fail:
              type: integer
              description: >-
                Total number of policy violations that caused a failure on
                components.
            high:
              type: integer
              description: >-
                Total number of policy violations with high severity on
                components.
            medium:
              type: integer
              description: >-
                Total number of policy violations with medium severity on
                components.
            low:
              type: integer
              description: >-
                Total number of policy violations with low severity on
                components.
    statistics:
      type: object
      properties:
        components:
          type: integer
          description: >-
            Number of software components discovered during Spectra Assure
            analysis.
        dependencies:
          type: integer
          description: >-
            Number of software dependencies discovered during Spectra Assure
            analysis.
        extracted:
          type: integer
          description: Number of artifacts extracted during Spectra Assure analysis.
        license:
          $ref: '#/components/schemas/license'
        vulnerabilities:
          $ref: '#/components/schemas/vulnerabilities'
        quality:
          $ref: '#/components/schemas/quality'
    detections:
      type: object
      description: File classification results.
      additionalProperties:
        type: object
        description: >-
          Detected threat type if any. 'No Threats Detected' used for Goodware
          and Unknown results.
        additionalProperties:
          type: integer
          description: Number of files that were detected as threats.
      example:
        Goodware:
          No Threats Detected: 19
        Malicious:
          Downloader: 1
    ai_insights:
      type: object
      required:
        - recommendation
        - code_summary
      properties:
        recommendation:
          type: string
          enum:
            - REJECT
            - APPROVE
          description: >-
            Recommendation to the user based on AI analysis of the code intent.
            AI is instructed to reject harmful and malicious packages.
          nullable: true
        code_summary:
          type: string
          description: >-
            AI-generated summary of code intent. Provides reasoning for the user
            recommendation.
    violations:
      type: object
      additionalProperties:
        type: object
        required:
          - rule_id
          - status
          - priority
          - severity
          - category
          - description
          - statistics
        properties:
          rule_id:
            type: string
            description: >-
              Unique policy identifier. A four digit number prefixed by a type
              identifier: SQ (software quality) or TH (threat hunting).
          status:
            type: string
            enum:
              - fail
              - warning
              - pass
            description: Policy evaluation result/status.
          priority:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
            description: >-
              Recommended policy violation fix priority. Range from P0 (highest)
              to P4 (lowest).
          severity:
            type: string
            enum:
              - high
              - medium
              - low
            description: Severity/impact of the matching policy.
          category:
            type: string
            description: Category of the matching policy.
          description:
            type: string
            description: Display label for the matching policy.
          statistics:
            type: object
            required:
              - applicable
              - enforcements
              - exclusions
              - violations
            properties:
              applicable:
                type: integer
                description: Number of files that the policy can be applied to.
              enforcements:
                type: integer
                description: Number of files that have failed due to the policy match.
              exclusions:
                type: integer
                description: Number of files that have an excluded policy match.
              violations:
                type: integer
                description: Number of files that have the policy match.
    indicators:
      type: object
      additionalProperties:
        type: object
        required:
          - rule_id
          - priority
          - category
          - description
          - exclusions
          - occurrences
          - violations
        properties:
          rule_id:
            type: string
            description: >-
              Unique behavior identifier. A four digit number prefixed by a type
              identifier: BH (behavior).
          priority:
            type: integer
            description: >-
              Helps order behaviors for display. More impactful behaviors have a
              higher priority value.
          category:
            type: string
            description: Category that best describes the behavior.
          description:
            type: string
            description: Human-readable behavior description.
          exclusions:
            type: integer
            description: Number of files that have an excluded behavior match.
          occurrences:
            type: integer
            description: Number of files that have exhibit this behavior.
          violations:
            type: integer
            description: Number of files that have failed due to the behavior presence.
    classifications:
      type: array
      items:
        type: object
        required:
          - object
          - status
          - result
          - hashes
        properties:
          object:
            type: string
            enum:
              - file
              - dependency
            description: >-
              Determines if the classified object is an embedded file or a
              component dependency.
          status:
            type: string
            enum:
              - Goodware
              - Suspicious
              - Malicious
              - Unknown
            description: Object classification.
          result:
            type: string
            description: >-
              Fully qualified threat name. String validation can be done with
              the ReversingLabs Malware Naming Standard.
          hashes:
            type: array
            description: Hashes are collected for classified files only.
            items:
              $ref: '#/components/schemas/hashes'
    vulnerabilities-2:
      type: object
      additionalProperties:
        type: object
        required:
          - name
          - cvss
          - updated
          - affects
          - summary
          - audit
          - exploit
        properties:
          name:
            type: string
            description: >-
              Popular vulnerability name. Usually used by media or marketing
              departments.
          cvss:
            type: object
            required:
              - version
              - baseScore
            properties:
              version:
                type: string
                description: CVSS schema version.
              baseScore:
                type: number
                format: float
                description: CVSS base score.
              vector:
                type: string
                description: >-
                  CVSS vector in the standardized format. CVSS versions 2.0 and
                  later are supported.
          updated:
            type: string
            description: Last vulnerability database update timestamp as ISO-8601 string.
          affects:
            type: array
            description: >-
              List of dependency PURLs affected by this vulnerability. For
              non-declared dependencies value 'non-manifest-component' is used.
          summary:
            type: string
            description: >-
              AI-generated summary of the original vulnerability description
              provided by the reporting source.
          audit:
            type: object
            required:
              - author
              - timestamp
              - reason
            properties:
              author:
                type: string
                description: >-
                  When vulnerabilities are triaged the audit record is populated
                  to track who triaged the vulnerability.
              timestamp:
                type: string
                description: >-
                  When vulnerabilities are triaged the audit record is populated
                  to track when vulnerability was triaged. Timestamp is a
                  ISO-8601 string.
              reason:
                type: string
                description: >-
                  When vulnerabilities are triaged the audit record is populated
                  to track the reason why the triage was performed.
                  User-provided reason.
          exploit:
            type: array
            description: List of tags that describe the vulnerability.
            items:
              type: string
              enum:
                - UNKNOWN
                - EXISTS
                - MALWARE
                - MANDATE
                - FIXABLE
                - TRIAGED
                - UNPROVEN
    dependencies:
      type: object
      additionalProperties:
        type: object
        required:
          - type
          - purl
          - community
          - framework
          - version
          - vulnerabilities
          - classification
        properties:
          type:
            type: string
            enum:
              - package
              - extension
            description: Software dependency declared by the package repository.
          purl:
            type: string
            description: >-
              Fully qualified package identifier (including the artifact
              reference)
          community:
            $ref: '#/components/schemas/communities'
          framework:
            type: string
            description: >-
              Defines the framework requirements needed to run the dependency.
              Currently only for .NET community use.
            nullable: true
          product:
            type: string
            description: Product name as declared by the publisher.
            nullable: true
          version:
            type: string
            description: PURL - version from pkg:community/namespace/package@version
          license:
            type: string
            description: >-
              Package license as the SPDX license expression. The format is
              ReversingLabs-specific: LicenseFamily (SPDX-expression).
            nullable: true
          vulnerabilities:
            type: array
            description: List of CVEs that were detected to affect the dependency.
          classification:
            type: object
            description: >-
              Declared package dependency classification. Used to annotate
              declared dependencies that resolve to known malware packages.
            properties:
              status:
                type: string
                enum:
                  - Suspicious
                  - Malicious
                description: Dependency classification.
                nullable: true
              result:
                type: string
                description: >-
                  Fully qualified threat name. String validation can be done
                  with the ReversingLabs Malware Naming Standard.
    oss-version:
      type: object
      required:
        - community
      properties:
        community:
          description: Spectra Assure Community analysis report for a package version.
          type: object
          required:
            - report
          properties:
            report:
              type: object
              required:
                - info
              properties:
                info:
                  type: object
                  required:
                    - file
                    - analysis
                  properties:
                    file:
                      $ref: '#/components/schemas/file'
                    analysis:
                      type: object
                      required:
                        - version
                        - catalogue
                        - timestamp
                      properties:
                        version:
                          type: string
                          description: Spectra Assure analysis engine version.
                        catalogue:
                          type: integer
                          nullable: true
                          description: Spectra Assure policy catalogue version.
                        timestamp:
                          type: string
                          description: Last package analysis time as ISO-8601 string.
                    statistics:
                      $ref: '#/components/schemas/statistics'
                    detections:
                      $ref: '#/components/schemas/detections'
                    disabled:
                      type: array
                      description: List of disabled policy checks.
                metadata:
                  type: object
                  properties:
                    assessments:
                      $ref: '#/components/schemas/assessments'
                    ai_insights:
                      $ref: '#/components/schemas/ai_insights'
                    incidents:
                      $ref: '#/components/schemas/incidents'
                    violations:
                      $ref: '#/components/schemas/violations'
                    indicators:
                      $ref: '#/components/schemas/indicators'
                    classifications:
                      $ref: '#/components/schemas/classifications'
                    vulnerabilities:
                      $ref: '#/components/schemas/vulnerabilities-2'
                    dependencies:
                      $ref: '#/components/schemas/dependencies'
    contributors:
      type: array
      items:
        type: object
        description: List of package contributor roles and people related to the project.
        required:
          - role
          - name
          - user
          - email
        properties:
          role:
            type: string
            enum:
              - developer
              - maintainer
              - author
              - contributor
              - owner
            description: Project contributor role.
          name:
            type: string
            description: >-
              Display name of the account associated with the contributor in the
              package repository.
          user:
            type: string
            description: >-
              User name of the account associated with the contributor in the
              package repository.
          email:
            type: string
            description: >-
              E-mail account associated with the contributor in the package
              repository.
    oss-package:
      type: object
      required:
        - community
      properties:
        community:
          type: object
          description: Spectra Assure Community analysis report for a package.
          required:
            - package
          properties:
            package:
              type: object
              allOf:
                - $ref: '#/components/schemas/package'
                - type: object
                  required:
                    - contributors
                  properties:
                    contributors:
                      $ref: '#/components/schemas/contributors'
    entitlements:
      type: object
      required:
        - used
        - allowed
      properties:
        used:
          type: integer
          nullable: true
          description: >-
            Number of entitlement units used by the account up to the moment of
            sending the request.
        allowed:
          type: integer
          nullable: true
          description: Maximum number of entitlement units allowed for this account.
    oss-account:
      type: object
      required:
        - account
      properties:
        account:
          type: object
          description: >-
            Information about the Spectra Assure Community user account sending
            the request.
          required:
            - name
            - role
            - email
            - company
            - country
            - subscription
            - entitlements
            - tokens
          properties:
            name:
              type: string
              description: User name associated with the account.
            role:
              type: string
              description: User role within their organization.
            email:
              type: string
              description: User email address associated with the account.
            company:
              type: string
              description: Company that the user belongs to.
            country:
              type: string
              description: Country in which the user is based.
            subscription:
              type: object
              required:
                - tier
                - expiration
              properties:
                tier:
                  type: string
                  enum:
                    - Community
                    - Community+
                    - Essentials
                    - Enterprise
                  description: >-
                    Spectra Assure Community subscription tier. Community
                    accounts are free, and have enforced usage limits.
                expiration:
                  type: string
                  description: Subscription expiration date as an ISO-8601 string.
            entitlements:
              type: object
              required:
                - api_tokens
                - api_requests
              properties:
                api_tokens:
                  allOf:
                    - $ref: '#/components/schemas/entitlements'
                    - description: Token creation entitlement details.
                api_requests:
                  allOf:
                    - $ref: '#/components/schemas/entitlements'
                    - description: >-
                        Community usage entitlements details. Usage resets at
                        the beginning of each calendar month.
                pkg_monitoring:
                  allOf:
                    - $ref: '#/components/schemas/entitlements'
                    - description: Package subscription entitlements details.
            tokens:
              type: array
              items:
                type: object
                required:
                  - label
                  - created_on
                  - last_used
                  - expires_on
                  - expired
                properties:
                  label:
                    type: string
                    description: User-provided token label or description.
                  created_on:
                    type: string
                    description: Token creation date as an ISO-8601 string.
                  last_used:
                    type: string
                    description: >-
                      The date when the token was last used, represented as an
                      ISO-8601 string.
                  expires_on:
                    type: string
                    description: Token expiration date as an ISO-8601 string.
                  expired:
                    type: boolean
                    description: >-
                      Indicates that the token has expired and can no longer be
                      used.
  parameters:
    organization:
      in: path
      name: organization
      required: true
      schema:
        type: string
        example: example-organization
        description: >-
          Specify the name of a Portal organization to use in the request. The
          user account that is sending the request must be a member of the
          specified organization and have the appropriate permissions to perform
          the requested operation. Organization names are case-sensitive.
    group:
      in: path
      name: group
      required: true
      schema:
        type: string
        example: example-group
        description: >-
          Specify the name of a Portal group to use in the request. The group
          must exist in the specified Portal organization. Group names are
          case-sensitive.
    project:
      in: path
      name: project
      required: true
      schema:
        type: string
        example: example-project
        description: >-
          Specify the name of a Portal project to use in the request. Project
          names are case-sensitive. Special characters `\/:*?"<>|` are not
          supported.
    package:
      in: path
      name: package
      required: true
      schema:
        type: string
        example: example-package
        description: >-
          Specify the name of a Portal package to use in the request. Package
          names are case-sensitive. Special characters `\/:*?"<>|` are not
          supported.
    version:
      in: path
      name: version
      required: true
      schema:
        type: string
        example: 1.2.0
        description: >-
          Specify the name of a Portal package version to use in the request.
          Version names are case-sensitive. Special characters `\/:*?"<>|` are
          not supported.
    build:
      in: query
      name: build
      required: false
      description: >-
        This optional parameter should be used when working with reproducible
        builds. Specify if the request should apply to the main artifact
        (`version`) or to the reproducible build artifact (`repro`). Only one of
        the two supported values can be specified per request.
      schema:
        type: string
        enum:
          - repro
          - version
        default: version
    download:
      in: query
      name: download
      required: false
      description: >-
        Returns a short-lived link where you can download the main version
        artifact or the reproducible build artifact. Use the `build` parameter
        in the request to specify the artifact to download. The link is valid
        for 60 seconds. **The link generation affects the Portal Download
        Capacity even if the artifact is not downloaded.**
      schema:
        type: boolean
        default: false
    product:
      in: query
      name: product
      required: false
      schema:
        $ref: '#/components/schemas/VersionMetadataProduct'
    publisher:
      in: query
      name: publisher
      required: false
      schema:
        $ref: '#/components/schemas/VersionMetadataPublisher'
    category:
      in: query
      name: category
      required: false
      schema:
        allOf:
          - $ref: '#/components/schemas/SoftwareCategory'
          - default: Other
    license:
      in: query
      name: license
      required: false
      schema:
        allOf:
          - $ref: '#/components/schemas/SoftwareLicense'
          - default: Unknown
    platform:
      in: query
      name: platform
      required: false
      schema:
        allOf:
          - $ref: '#/components/schemas/SoftwarePlatform'
          - default: Other
    release_date:
      in: query
      name: release_date
      required: false
      description: >-
        Date and time to set and display as the release date for the software
        package you're uploading to the Portal. If it's not specified, the
        software package is marked as unreleased in the Portal. You can change
        the release status at any time directly through the Portal interface.
      schema:
        $ref: '#/components/schemas/DateTime'
    replace:
      in: query
      name: replace
      required: false
      description: >-
        This optional parameter lets you replace (overwrite) an already existing
        package version in the project with the package version you're
        uploading. This functionality is equivalent to the `--replace` option in
        the `rl-secure scan` command. If this parameter is set to **false** and
        the package version you're trying to upload already exists in the
        specified project, the API returns the 409 error response.
      schema:
        type: boolean
        default: false
    content_disposition:
      in: header
      name: Content-Disposition
      required: true
      description: >-
        Specify the name of the uploaded file preceded by the `attachment`
        parameter. This file name will be visible in the analysis reports.
      schema:
        type: string
        example: attachment; filename=upload.exe
    max_size:
      in: query
      name: max_size
      required: false
      schema:
        type: integer
        description: >-
          The maximum file size to attempt to download, in bytes. Keep in mind
          that determining file size before download can be unreliable.
    file_id:
      in: path
      name: file_id
      required: true
      schema:
        type: string
        format: uuid
        example: 57f70f86-71ea-43f8-b443-515d911c8d4a
        description: >-
          Specify the server-generated ID of a File Stream file to use in the
          request. The ID is returned in the response when the file is uploaded
          or imported.
    filestream_download:
      in: query
      name: download
      required: false
      description: >-
        Returns a short-lived link where you can download the File Stream file.
        Requires the `download_filestream_files` permission in addition to the
        permission needed to read the status. The link is valid for 60 seconds.
        The link generation affects the Portal Download Capacity even if the
        file is not downloaded.
      schema:
        type: boolean
        default: false
    filestream_version:
      in: query
      name: version
      required: false
      schema:
        $ref: '#/components/schemas/VersionMetadataVersion'
    filter:
      name: filter
      in: query
      schema:
        type: string
      description: >
        Using the filter query parameter returns only specific resources. The
        value should be a filter expression, and only matching resources will be
        included in the response. The expression supports attributes and literal
        values.


        Filtering is case-insensitive for both attribute names and operators.


        For more on filtering with SCIM routes, check the [official
        documentation](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.2).
      example: userName eq "john@company.com"
    startIndex:
      name: startIndex
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        The position of the first result, where indexing starts at 1. Check
        [Section 3.4.2.4 of RFC
        7644](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.4) for
        details about pagination.
      example: 1
    count:
      name: count
      in: query
      schema:
        type: integer
        minimum: 1
        default: 50
      description: >-
        Maximum results per page. Check [Section 3.4.2.4 of RFC
        7644](https://datatracker.ietf.org/doc/html/rfc7644#section-3.4.2.4) for
        details about pagination.
      example: 10
    userId:
      name: uuid
      in: path
      description: ID of the user.
      required: true
      schema:
        type: string
        format: uuid
      example: 2819c223-7f76-453a-919d-413861904646
    jobId:
      name: job_id
      in: path
      description: The ID of an audit export job.
      required: true
      schema:
        type: string
        format: uuid
      example: 2819c223-7f76-453a-919d-413861904646
    catalog:
      in: path
      name: catalog
      required: true
      schema:
        type: string
      example: reversinglabs
      description: Identifier of an external software catalog. Currently `reversinglabs`.
    architecture:
      in: query
      name: architecture
      required: false
      description: >-
        Processor or runtime architecture of the software. It must be valid for
        the specified platform, otherwise the API returns the 400 error
        response.
      schema:
        $ref: '#/components/schemas/SoftwarePlatformArchitecture'
    query_offset:
      name: offset
      in: query
      description: >-
        This optional parameter is used for pagination to specify the starting
        index when enumerating package versions in the response.
      required: false
      schema:
        type: integer
        default: 0
    query_limit:
      name: limit
      in: query
      description: >-
        Specify the maximum number of package versions to include in the
        response.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 5
    is_compact:
      name: compact
      in: query
      description: >-
        When this parameter is specified in the request, all optional response
        fields are automatically removed from the response to reduce its size.
        Intended for OEM and product integrations.
      required: false
      schema:
        type: boolean
        default: false
    purl_community:
      name: community
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/communities'
    purl_namespace:
      name: namespace
      in: path
      description: >-
        Namespace of the requested software package (according to the purl
        schema `pkg:repository/namespace/package@version`).
      required: false
      example: '@ampproject'
      schema:
        type: string
    purl_package:
      name: package
      in: path
      description: >-
        Name of the requested software package (according to the purl schema
        `pkg:repository/namespace/package@version`).
      required: true
      example: remapping
      schema:
        type: string
    purl_version:
      name: version
      in: path
      description: >-
        Version of the requested software package (according to the purl schema
        `pkg:repository/namespace/package@version`).
      required: false
      example: 2.3.0
      schema:
        type: string
    purl_artifact:
      name: artifact
      in: query
      description: >-
        Qualifier that specifies the artifact file of the requested software
        package (according to the purl schema
        `pkg:repository/namespace/package@version?artifact=filename.ext`). Note
        that some software repositories (communities) do not support searching
        for artifacts.
      required: false
      example: mock_numpy-2.2.0-.tar.gz
      schema:
        type: string
    purl_artifact_tag:
      name: artifact_tag
      in: query
      description: >-
        Qualifier that specifies the artifact file of the requested software
        package by a repository-specific tag (according to the purl schema
        `pkg:repository/namespace/package@version?artifact_tag=example_tag`).
        Note that some software repositories (communities) do not support
        searching for artifacts.
      required: false
      example: cp310-cp310-win_amd64
      schema:
        type: string
    match_pattern:
      name: match_pattern
      in: query
      description: >-
        Specifies the community-specific version glob pattern. Used for
        dependency resolution. Should not be used together with `version` or
        `match_expression`.
      required: false
      example: 1.3.*
      schema:
        type: string
    match_expression:
      name: match_expression
      in: query
      description: >-
        Specifies the community-specific version expression. Used for dependency
        resolution. Should not be used together with `version` or
        `match_pattern`.
      required: false
      example: <= 18.3.0
      schema:
        type: string
  securitySchemes:
    TokenAuthentication:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NoOrganization:
              $ref: '#/components/examples/NoOrganization'
            NoGroup:
              $ref: '#/components/examples/NoGroup'
            UnsupportedCharacter:
              $ref: '#/components/examples/UnsupportedCharacter'
    Unauthorized:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NoToken:
              value:
                error: Authentication credentials were not provided
            WrongToken:
              value:
                error: Invalid token
    InsufficientRemainingCapacity:
      description: Insufficient remaining capacity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            PaymentRequired:
              value:
                error: Insufficient remaining capacity
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Bad gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UploadFailed:
              value:
                error: Failed to upload file
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReportProcessingNotDone:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VersionNotDoneWithAnalysis:
              value:
                error: Cannot get report for version that is not done with analysis
    ReportNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            VersionDoesntExist:
              value:
                error: Provided version doesn't exist
            VersionDoesntHaveRepro:
              value:
                error: Provided version does not have a reproducible build
            VersionDoesntHavePredecessor:
              value:
                error: Cannot get rl-diff report for version without a predecessor
    ReportWithoutAnalysis:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Messages'
          examples:
            VersionNotDoneWithAnalysis:
              value:
                message: Cannot get report for version that is not done with analysis
            VersionWithNoCompleteAnalysis:
              value:
                message: >-
                  Cannot get report for version that does not have complete
                  analysis
    ChecksWithoutAnalysis:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Messages'
          examples:
            VersionNotDoneWithAnalysis:
              value:
                message: Cannot get checks for version that is not done with analysis
            VersionWithNoCompleteAnalysis:
              value:
                message: >-
                  Cannot get checks for version that does not have complete
                  analysis
            FileNotDoneWithAnalysis:
              value:
                message: Cannot get checks for file that is not done with analysis
    Created:
      description: Created
      content:
        text/plain:
          example: Created
    OK:
      description: OK
      content:
        text/plain:
          example: OK
    Deleted:
      description: Deleted
      content:
        text/plain:
          example: Deleted
    VersionAlreadyExists:
      description: Version already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectAlreadyExists:
      description: Project already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PackageAlreadyExists:
      description: Package already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProfileImported:
      description: OK
      content:
        application/json:
          schema:
            type: object
    ScimInvalidValue:
      description: An invalid value was passed in the payload
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimUnauthorized:
      description: >-
        Missing or invalid token, or the token's user lacks Organization
        Administrator permissions
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimForbidden:
      description: SSO is not enabled, so SCIM cannot be used
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimUnknownId:
      description: ID passed unknown
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimNotAcceptable:
      description: Accept header must be application/scim+json
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimConflict:
      description: >-
        There is a conflict with an already existing user. Uniqueness is assumed
        over userName
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScimServerError:
      description: There was an unexpected failure executing the operation
      content:
        application/scim+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FilestreamFileCreated:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilestreamFileReference'
    FilestreamImportBadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            MaxFileSizeExceeded:
              $ref: '#/components/examples/MaxFileSizeExceeded'
    FilestreamUnsupportedParameter:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                description: >-
                  File Stream files do not support the `build`, `diff_with`,
                  `force`, `is_released` and `replace` parameters.
    FilestreamFileNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FileDoesntExist:
              value:
                error: Provided file doesn't exist.
            ReportFileNotFound:
              value:
                error: >-
                  Report unavailable. Reprocess the file and try downloading the
                  report again.
    FilestreamFileDoesntExist:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FileDoesntExist:
              value:
                error: Provided file doesn't exist.
    oss-search:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-search'
    bad-request:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          examples:
            MalformedRequest:
              value:
                error: Invalid structure of the request body
            UnsupportedParameter:
              value:
                error: >-
                  Invalid argument, the {purl_type} repository doesn't support
                  artifact argument in the request.
    unauthorized:
      description: Not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          examples:
            NoToken:
              value:
                error: Authentication credentials were not provided
            WrongToken:
              value:
                error: Invalid token
    low-capacity:
      description: Insufficient remaining capacity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          examples:
            PaymentRequired:
              value:
                error: Insufficient remaining capacity
    forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          example:
            error: Forbidden
    content-too-large:
      description: Content too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          example:
            error: Too many packages requested
    too-many-requests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          example:
            error: Too many requests
    server-error:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          example:
            error: Server error
    oss-version:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-version'
    not-found:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-error'
          example:
            error: Not found
    oss-package:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-package'
    oss-account:
      description: Spectra Assure Community user account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/oss-account'
  requestBodies:
    ProfileImport:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - configuration_file
            properties:
              configuration_file:
                type: string
                format: binary
              replace:
                type: boolean
                default: true
                description: >-
                  This optional flag lets you decide how the imported
                  configuration is applied. If true, the existing configuration
                  is fully replaced by the imported configuration. If false, the
                  imported configuration is merged into the existing
                  configuration (only provided overrides are updated; others
                  remain unchanged).
    FileUpload:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: File to be uploaded to the Portal.
    UrlImport:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                description: >-
                  The URL from which you want to download and import a software
                  package into the Portal. If the URL is not valid or if there
                  is no downloadable file at the specified location, the import
                  will fail.
                format: uri
                maxLength: 4096
                example: https://example.com/downloads/example-file.exe
              auth-user:
                type: string
                description: >-
                  If authentication is required for downloading the software
                  package from the specified URL, use this parameter to provide
                  the username. Cannot be used with `bearer-token`. Importing
                  from DockerHub requires either a username and password or a
                  bearer token.
                example: username
              auth-pass:
                type: string
                format: password
                description: >-
                  If authentication is required for downloading the software
                  package from the specified URL, use this parameter to provide
                  the password. Cannot be used with `bearer-token`. Importing
                  from DockerHub requires either a username and password or a
                  bearer token.
              bearer-token:
                type: string
                description: >-
                  If token-based authentication is required for downloading the
                  software package from the specified URL, use this parameter to
                  provide a Bearer token. Cannot be used with `auth-user` and
                  `auth-pass`. Importing from DockerHub requires either a
                  username and password or a bearer token.
                example: Bearer <token>
    PurlImport:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - purl
            properties:
              purl:
                type: string
                format: purl
                description: >-
                  The PURL from which you want to download and import a software
                  package into the Portal. If the PURL is not valid, the import
                  will fail.
                maxLength: 4096
                example: >-
                  pkg:pypi/pyaudio@0.2.13?artifact=PyAudio-0.2.13-cp311-cp311-win_amd64.whl
              auth-user:
                type: string
                description: >-
                  If authentication is required for downloading the software
                  package from the specified PURL, use this parameter to provide
                  the username. Cannot be used with `bearer-token`. Importing
                  from DockerHub requires either a username and password or a
                  bearer token.
                example: username
              auth-pass:
                type: string
                format: password
                description: >-
                  If authentication is required for downloading the software
                  package from the specified PURL, use this parameter to provide
                  the password. Cannot be used with `bearer-token`. Importing
                  from DockerHub requires either a username and password or a
                  bearer token.
              bearer-token:
                type: string
                description: >-
                  If token-based authentication is required for downloading the
                  software package from the specified PURL, use this parameter
                  to provide a Bearer token. Cannot be used with `auth-user` and
                  `auth-pass`. Importing from DockerHub requires either a
                  username and password or a bearer token.
                example: Bearer <token>
    ApproveRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TPRMReason'
          examples:
            ApprovalReason:
              value:
                reason: No failing policy checks identified during analysis
    RejectRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TPRMReason'
          examples:
            RejectionReason:
              value:
                reason: >-
                  Alternate software selected for approval that poses less
                  security risk
    RevokeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TPRMReason'
          examples:
            RevokeReason:
              value:
                reason: Fixing inadvertent or incorrect approval of software
    json_search:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              oneOf:
                - type: object
                  title: SearchByPurl
                  required:
                    - uuid
                    - purl
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    purl:
                      type: string
                      description: >-
                        Fully qualified package URL (purl) of the software
                        package to search for, in the format
                        `pkg:community/namespace/package@version`. If the
                        `version` part of the purl is omitted, the response
                        contains information about the latest published version.
                        The purl is case-insensitive. For more information on
                        the correct purl syntax, consult the [official purl
                        specification](https://github.com/package-url/purl-spec).
                      example: pkg:pypi/numpy@1.2.3
                - type: object
                  title: SearchBySha1
                  required:
                    - uuid
                    - sha1
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    sha1:
                      type: string
                      description: >-
                        Search for a package with this hash, or packages that
                        contain this hash. Hashes of embedded files are tracked
                        only if they are malware artifacts.
                      example: d63932d669fe6da664b4183d8e1d5a33a9492b9f
                - type: object
                  title: SearchBySha256
                  required:
                    - uuid
                    - sha256
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    sha256:
                      type: string
                      description: >-
                        Search for a package with this hash, or packages that
                        contain this hash. Hashes of embedded files are tracked
                        only if they are malware artifacts.
                      example: >-
                        94957715a483aa3b9db60c8f22d5498227d8025c407f982eef81e34f37574ffd
                - type: object
                  title: MatchPurlByPattern
                  required:
                    - uuid
                    - purl
                    - match_pattern
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    purl:
                      type: string
                      description: >-
                        Partial package URL (purl) of the software package to
                        search for. Must satisfy the following purl schema:
                        `pkg:community/namespace/package?artifact=filename.ext`.
                        For more information on the correct purl syntax, consult
                        the [official purl
                        specification](https://github.com/package-url/purl-spec/blob/main/purl-specification.md#rules-for-each-purl-component).
                      example: pkg:pypi/mock-numpy
                    match_pattern:
                      type: string
                      description: >-
                        Search for all versions that match the
                        community-agnostic glob pattern.
                      example: 1.*.*
                - type: object
                  title: MatchPurlByExpression
                  required:
                    - uuid
                    - purl
                    - match_expression
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    purl:
                      type: string
                      description: >-
                        Partial package URL (purl) of the software package to
                        search for. Must satisfy the following purl schema:
                        `pkg:community/namespace/package?artifact=filename.ext`.
                        For more information on the correct purl syntax, consult
                        the [official purl
                        specification](https://github.com/package-url/purl-spec/blob/main/purl-specification.md#rules-for-each-purl-component).
                      example: pkg:pypi/mock-numpy
                    match_expression:
                      type: string
                      description: >-
                        Search for all versions that match the
                        community-specific expression.
                      example: '> 1.3.4'
                - type: object
                  title: MatchArtifacts
                  required:
                    - uuid
                    - community
                    - package
                  properties:
                    uuid:
                      $ref: '#/components/schemas/uuid'
                    community:
                      $ref: '#/components/schemas/communities'
                    namespace:
                      type: string
                      description: >-
                        The namespace part of the purl to search for (according
                        to the schema
                        `pkg:community/namespace/package@version?artifact=filename.ext`).
                    package:
                      type: string
                      description: >-
                        The package part of the purl to search for (according to
                        the schema
                        `pkg:community/namespace/package@version?artifact=filename.ext`).
                    version:
                      type: string
                      description: >-
                        The version part of the purl to search for (according to
                        the schema
                        `pkg:community/namespace/package@version?artifact=filename.ext`).
                    artifact:
                      type: string
                      description: >-
                        The artifact part of the purl to search for (according
                        to the schema
                        `pkg:community/namespace/package@version?artifact=filename.ext`).
                        Note that some software repositories (communities) do
                        not support searching for artifacts.
                    artifact_tag:
                      type: string
                      description: >-
                        The artifact_tag part of the purl to search for
                        (according to the schema
                        `pkg:community/namespace/package@version?artifact_tag=example_tag`).
                        Note that some software repositories (communities) do
                        not support searching for artifacts.
                    match_expression:
                      type: string
                      description: >-
                        Search for all versions that match the
                        community-specific expression. Should not be used
                        together with `version`.
                      example: '> 1.3.4'
                    match_pattern:
                      type: string
                      description: >-
                        Search for all versions that match the
                        community-agnostic glob pattern. Should not be used
                        together with `version`.
                      example: 1.*.*
  examples:
    NoOrganization:
      value:
        error: Organization with provided reference does not exist
    NoGroup:
      value:
        error: Group with provided reference does not exist
    UnsupportedCharacter:
      value:
        error: >-
          Resource name contains one or more of the following forbidden
          characters \/:*?"<>|
    MaxNumberOfVersionsInPackage:
      value:
        error: Package has reached maximum number of versions
    ReplaceVersionWithExistingDescendants:
      value:
        error: Cannot replace version with existing descendants
    InvalidPreviousVersion:
      value:
        error: Invalid previous version
    MaxFileSizeExceeded:
      value:
        error: File size exceeds provided 'max_size'
    FileNotProcessed:
      value:
        error: Cannot change approval status if file is not successfully processed.
