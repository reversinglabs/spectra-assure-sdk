      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/build'
    get:
      operationId: getRlSafeVersionArchive
      summary: Export RL-SAFE archive
      description: >-
        Generate the RL-SAFE archive download link for the specified package
        version. The RL-SAFE archive contains the full SAFE report and all other
        supported report formats for a software package. To open the archive and
        work with it, you need the [SAFE
        Viewer](https://docs.secure.software/safe-viewer) - a free,
        cross-platform tool developed by ReversingLabs. 


        **The RL-SAFE archive is the only way to download the complete SAFE
        report from the Portal for offline viewing and sharing.** Read more
        about [the RL-SAFE
        archive](https://docs.secure.software/concepts/analysis-reports#rl-safe-archive)
        to understand its contents and purpose.


        The response includes the `download_link` field. That is the URL from
        which you can download the RL-SAFE archive. The URL is valid until the
        time specified in the `expiration_timestamp` response field. When the
        URL expires, you have to send a new request to this endpoint to get the
        URL again.


        By default, the endpoint returns the download link for the RL-SAFE
        archive of the main (representative) artifact in the package version. To
        download the archive of a reproducible build artifact, use the `build`
        query parameter set to the `repro` value. If a reproducible build
        artifact does not exist for the requested package version, the API
        returns a 400 error response.
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >
            curl -L
            'https://your-portal-url/api/public/v1/pack/safe/your-organization/your-group/pkg:rl/your-project/your-package@version'
            \

            -H 'Authorization: Bearer your-personal-access-token'
        - lang: python
          label: Python - Requests
          source: >
            import requests


            url =
            "https://your-portal-url/api/public/v1/pack/safe/your-organization/your-group/pkg:rl/your-project/your-package@version"


            payload = {}

            headers = {
              'Authorization': 'Bearer your-personal-access-token'
            }


            response = requests.request("GET", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'GET',
              'url': 'https://your-portal-url/api/public/v1/pack/safe/your-organization/your-group/pkg:rl/your-project/your-package@version',
              'headers': {
                'Authorization': 'Bearer your-personal-access-token'
              }
            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - download_link
                  - file_name
                  - expiration_timestamp
                properties:
                  download_link:
                    type: string
                    description: >-
                      The URL from which you can download the RL-SAFE archive
                      for the requested package version. The URL is valid until
                      the date and time specified in the `expiration_timestamp`
                      field.
                    example: http://cloud.storage.url/example/your-report.rl-safe
                  file_name:
                    type: string
                    description: >-
                      Name of the RL-SAFE archive file that will be downloaded
                      from the URL specified in the `download_link` field.
                    example: report.rl-safe
                  expiration_timestamp:
                    type: string
                    format: date-time
                    description: >-
                      The date and time when the download URL for the RL-SAFE
                      archive expires.
                    example: '2024-11-26T06:48:39.412093+00:00'
        '202':
          $ref: '#/components/responses/ReportWithoutAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /edit/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    patch:
      operationId: patchVersion
      summary: Modify a version
      description: >-
        Update the information about a package version that was previously
        uploaded to a project in the Portal. With this endpoint, you can change
        the release status of a package version and modify parts of the package
        version metadata (product name, publisher name, software category,
        license, platform, architecture, and release date). Only one package
        version can be modified per request. For a package imported from an
        external catalog, only the release status (with `is_released`) and
        release date can be changed.
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >-
            curl -L -X PATCH
            'https://your-portal-url/api/public/v1/edit/your-organization/your-group/pkg:rl/your-project/your-package@version'
            \

            -H 'Content-Type: application/json' \

            -H 'Authorization: Bearer your-personal-access-token' \

            -d '{
                "is_released": false,
                "product": "Changed application name"
            }'
        - lang: python
          label: Python - Requests
          source: >
            import requests

            import json


            url =
            "https://your-portal-url/api/public/v1/edit/your-organization/your-group/pkg:rl/your-project/your-package@version"


            payload = json.dumps({
              "is_released": False,
              "product": "Changed application name"
            })

            headers = {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer your-personal-access-token'
            }


            response = requests.request("PATCH", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'PATCH',
              'url': 'https://your-portal-url/api/public/v1/edit/your-organization/your-group/pkg:rl/your-project/your-package@version',
              'headers': {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer your-personal-access-token'
              },
              body: JSON.stringify({
                "is_released": false,
                "product": "Changed application name"
              })

            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_released:
                  type: boolean
                  description: >-
                    Indicates whether the software package version should be
                    displayed as released or not in the Portal interface. When
                    set to `true` without a `release_date` (and the version does
                    not already have one), the release date defaults to the
                    current date and time.
                product:
                  $ref: '#/components/schemas/VersionMetadataProduct'
                publisher:
                  $ref: '#/components/schemas/VersionMetadataPublisher'
                category:
                  $ref: '#/components/schemas/SoftwareCategory'
                license:
                  $ref: '#/components/schemas/SoftwareLicense'
                platform:
                  $ref: '#/components/schemas/SoftwarePlatform'
                architecture:
                  allOf:
                    - $ref: '#/components/schemas/SoftwarePlatformArchitecture'
                    - description: >-
                        Processor or runtime architecture of the software. It
                        must be valid for the version's platform, for example
                        `x64` for `Windows` or `Chromium` for `Browser`. If you
                        change only the platform and the current architecture
                        does not fit it, the architecture is set to `Generic`.
                release_date:
                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                    - description: >-
                        Date and time to set and display as the release date for
                        the software package version in the Portal. If the
                        version status is being changed to released
                        (`is_released: true`), and no release date is provided
                        or already set, it defaults to the current date and
                        time.
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SoftwareLinkedToExternalCatalog:
                  value:
                    error: >-
                      Package is linked to an external catalog and its software
                      info cannot be edited
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
