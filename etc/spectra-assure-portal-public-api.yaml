        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'GET',
              'url': 'https://your-portal-url/api/public/v1/checks/your-organization/your-group/pkg:rl/your-project/your-package@version',
              'headers': {
