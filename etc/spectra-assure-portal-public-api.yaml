          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportJobRequest'
            examples:
              both_formats:
                summary: Request both CEF and NDJSON
                value:
                  name: April audit export
                  datetime_start: '2025-01-01T00:00:00Z'
                  datetime_end: '2025-04-01T00:00:00Z'
                  filters:
                    - filter_by: action
                      operation: is_any
                      values:
                        - package.created
                        - package.deleted
                  should_create_cef: true
                  should_create_ndjson: true
              cef_only:
                summary: CEF only
                value:
                  name: CEF export
                  datetime_start: '2025-01-01T00:00:00Z'
                  datetime_end: '2025-04-01T00:00:00Z'
                  filters:
                    - filter_by: action
                      operation: is_any
                      values:
                        - package.created
                        - package.deleted
                  should_create_cef: true
                  should_create_ndjson: false
      responses:
        '201':
          description: Export job created. Processing has started in the background.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: April audit export
                cef_status: IN_PROGRESS
                cef_presigned_url: null
                cef_expires_at: null
                ndjson_status: IN_PROGRESS
                ndjson_presigned_url: null
                ndjson_expires_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /audit-log/{organization}/export/{job_id}/status:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: getAuditExportStatus
      summary: Check log export status
      description: >-
        Check log export status. Use this to check the status of the log export
        and to retrieve the actual log file (if it's successfully exported). The
        ID from the POST operation response is required to successfully send a
        GET request. This means that the POST operation must be used first to
        start the log export.
      tags:
        - Audit
      responses:
        '200':
          description: >-
            Export job data. If export is finished, it will contain the download
            URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: April audit export
                cef_status: IN_PROGRESS
                cef_presigned_url: null
                cef_expires_at: null
                ndjson_status: IN_PROGRESS
                ndjson_presigned_url: null
                ndjson_expires_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /scim/v2/Users:
    get:
      tags:
        - SCIM
      summary: Query users
      description: >-
        Retrieve information about user accounts in the Portal. The SCIM
        protocol provides a standard set of query parameters for filtering and
        paginating results, so a request can return zero or more results.
      operationId: queryUser
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/startIndex'
        - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: Successful query
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/QueryUserResponse'
        '400':
          description: Filter supplied was unparsable
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '500':
          $ref: '#/components/responses/ScimServerError'
    post:
      tags:
        - SCIM
      summary: Create a new user
      description: >-
        Create a new user account in the Portal and return the created user
        object to the service provider.
      operationId: createUser
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successfully created the user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/ScimInvalidValue'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '409':
          $ref: '#/components/responses/ScimConflict'
        '500':
          $ref: '#/components/responses/ScimServerError'
  /scim/v2/Users/{uuid}:
    get:
      tags:
        - SCIM
      summary: Retrieve an existing user
      description: >-
        Retrieve a user by ID and verify whether the user exists in the SCIM
        application.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Successfully returned the resource
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          description: userId in URL must be UUID
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '404':
          $ref: '#/components/responses/ScimUnknownId'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '500':
          $ref: '#/components/responses/ScimServerError'
    patch:
      tags:
        - SCIM
      summary: Modify specific user information
      operationId: modifyUserAttributes
      description: >-
        Update a user’s first name, last name, or active status using `replace`
        operations. Other PATCH operations (`add`, `remove`) are not supported.


        See [Section 3.5.2 of RFC
        7644](https://datatracker.ietf.org/doc/html/rfc7644#section-3.5.2) for
        the PATCH semantics.
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: Successfully patched the user attributes
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/PatchUserResponse'
        '400':
          $ref: '#/components/responses/ScimInvalidValue'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '404':
          description: User not found
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '409':
          $ref: '#/components/responses/ScimConflict'
        '500':
          $ref: '#/components/responses/ScimServerError'
        '501':
          description: Requested operation is not implemented.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - SCIM
      summary: Update all user information
      description: >-
        Replace all attributes of a resource. 


        Users that have previously retrieved and modified a full resource may
        use an HTTP `PUT` request to replace it. Since SCIM resource identifiers
        are assigned by the service provider, `PUT` should not be used to create
        new resources.


        Because this operation replaces all attributes, clients may include them
        in the request, even if some are not normally mutable.
      operationId: replaceUserAttributes
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Successfully updated the attributes
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '400':
          description: >-
            An invalid value was passed in the payload or the user ID is not a
            valid UUID
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '404':
          $ref: '#/components/responses/ScimUnknownId'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '409':
          $ref: '#/components/responses/ScimConflict'
        '500':
          $ref: '#/components/responses/ScimServerError'
    delete:
      tags:
        - SCIM
      summary: Delete a user
      description: Remove a specific user account from the Spectra Assure Portal instance.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Successfully removed the user
        '400':
          description: The user ID is not a valid UUID
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '404':
          $ref: '#/components/responses/ScimUnknownId'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '409':
          description: >-
            The user cannot be deleted: it is a staff user, the user making the
            request, or the last Organization Administrator
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ScimServerError'
  /scim/v2/Users/.search:
    post:
      tags:
        - SCIM
      summary: Search for users
      operationId: searchUsers
      description: >-
        Search for users that match specific search criteria. 


        SCIM provides standard query parameters for filtering, sorting, and
        pagination, allowing queries to return any number of resources. Queries
        can be made against a single resource, a resource endpoint (e.g.,
        `/Users`), or the base URI. Providers may support extra parameters and
        should ignore unknown ones to stay compatible.
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/startIndex'
        - $ref: '#/components/parameters/count'
      requestBody:
        description: Payload that represents the search criteria
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/QueryUserResponse'
        '400':
          description: >-
            The filter is missing or unparsable, `count` or `startIndex` is
            lower than 1, or the search request schema is invalid
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/ScimUnauthorized'
        '403':
          $ref: '#/components/responses/ScimForbidden'
        '406':
          $ref: '#/components/responses/ScimNotAcceptable'
        '500':
          $ref: '#/components/responses/ScimServerError'
  /list/{organization}/{group}/filestream:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - in: query
        name: limit
        required: false
        description: >-
          Specify the number of files to return per page. The maximum supported
          number is 100. If a larger number is provided in the request, it is
          capped at 100. If an invalid value is provided in the request, the API
          falls back to the default value.
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - in: query
        name: offset
        required: false
        description: Specify the number of files to skip from the start of the result set.
        schema:
          type: integer
          default: 0
          minimum: 0
      - in: query
        name: file_name
        required: false
        description: >-
          Return only files whose name contains the given value
          (case-insensitive).
        schema:
          type: string
      - in: query
        name: user
        required: false
        description: >-
          Return only files uploaded by the user with the given email address
          (case-insensitive exact match).
        schema:
          type: string
      - in: query
        name: approval_status
        required: false
        description: Return only files with the given approval status (case-insensitive).
        schema:
          type: string
          enum:
            - Undetermined
            - Approved
            - ApprovalRejected
            - ApprovalRevoked
      - in: query
        name: deleted_in_days
        required: false
        description: >-
          Return only files that the retention policy will automatically delete
          within the specified number of days. The maximum supported number
          corresponds to the configured file retention period on the Portal (90
          days). Larger values return the 400 error response.
        schema:
          type: integer
          minimum: 0
      - in: query
        name: sort_by
        required: false
        description: >-
          Sort the results by the given field. Prefix the field name with `-`
          for descending order, or with `+` for explicit ascending order. Only
          one sort field is applied.
        schema:
          type: string
          enum:
            - file_name
            - +file_name
            - '-file_name'
            - upload_date
            - +upload_date
            - '-upload_date'
          default: '-upload_date'
    get:
      operationId: listFilestreamFiles
      summary: List all files in File Stream
      description: >-
        List the files in the File Stream area of the specified Spectra Assure
        Portal group. The response is paginated with the `limit` and `offset`
        query parameters and sorted by upload date (newest first) unless
        requested otherwise with `sort_by`.
      tags:
        - File Stream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - match_count
                  - files
                properties:
                  match_count:
                    type: integer
                    description: >-
                      Total number of files matching the request, across all
                      pages.
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FilestreamFile'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /scan/{organization}/{group}/filestream:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/filestream_version'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
      - $ref: '#/components/parameters/content_disposition'
      - in: header
        name: Content-Length
        required: false
        description: >-
          Size in bytes of the uploaded file. If it is larger than available
          quota, it will result in status 402. Can be omitted when the file is
          sent with `Transfer-Encoding: chunked`. Chunked uploads must use
          `Content-Type: application/octet-stream`.
        schema:
          type: string
          example: '524288'
    post:
      operationId: scanFilestreamFile
      summary: Upload a file to File Stream
      description: >-
        Upload a file to the File Stream and submit it for analysis. Files in
        the File Stream are standalone and don't belong to any project or
        package. For a file to be successfully uploaded and analyzed on the
        Portal, your group must have enough available analysis capacity. The
        file size you want to upload must not exceed any configured group
        limits.


        The response contains the server-generated file ID. Use it with the
        other File Stream endpoints to check the analysis status of the file,
        download it, export its reports, manage its approval status, or delete
        it.


        Only one file can be uploaded per request. The File Stream doesn't
        support uploading multiple versions of the same file (software package),
        creating diffs, and marking software packages as released. To use those
        features, work with Portal Projects.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/FileUpload'
      responses:
        '201':
          $ref: '#/components/responses/FilestreamFileCreated'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FileSizeLimitExceeded:
                  value:
                    error: File size limit exceeded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /url-import/{organization}/{group}/filestream:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/filestream_version'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
      - $ref: '#/components/parameters/max_size'
    post:
      operationId: importFilestreamURL
      summary: Import a file from URL
      description: >-
        Import a file via URL into the File Stream area of a group in the
        Spectra Assure Portal. The file is downloaded and analyzed
        asynchronously.


        The response contains the server-generated file ID. Use it with the
        **Check File Stream file status** endpoint to track the download and
        analysis progress.


        Only one file can be imported per request.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/UrlImport'
      responses:
        '201':
          $ref: '#/components/responses/FilestreamFileCreated'
        '400':
          $ref: '#/components/responses/FilestreamImportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /purl-import/{organization}/{group}/filestream:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/filestream_version'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
      - $ref: '#/components/parameters/max_size'
    post:
      operationId: importFilestreamPURL
      summary: Import a file from PURL
      description: >-
        Import a file via pURL into the File Stream area of a group in the
        Spectra Assure Portal. The file is downloaded and analyzed
        asynchronously.


        The response contains the server-generated file ID. Use it with the
        **Check File Stream file status** endpoint to track the download and
        analysis progress.


        Only one file can be imported per request.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/PurlImport'
      responses:
        '201':
          $ref: '#/components/responses/FilestreamFileCreated'
        '400':
          $ref: '#/components/responses/FilestreamImportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sync/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    post:
      operationId: syncFilestreamFile
      summary: Rescan a file
      description: >-
        Re-scans an existing File Stream file to synchronize it with the updated
        configuration or with the latest engine update. Reanalyzing a file does
        not count towards the monthly analysis capacity.
      tags:
        - File Stream
      responses:
        '200':
          description: File already in sync
        '202':
          description: Sync started
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FileNotDownloaded:
                  value:
                    error: File is not downloaded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileDoesntExist'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /status/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
      - $ref: '#/components/parameters/filestream_download'
    get:
      operationId: getFilestreamFileStatus
      summary: Show file analysis status
      description: >-
        Check the status of a file that was previously uploaded or imported into
        the File Stream area of a group. If the file has been successfully
        analyzed, the response includes a summary of the analysis report. To
        retrieve the full analysis report in any of the supported formats, use
        the File Stream report export endpoints.
      tags:
        - File Stream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - analysis
                properties:
                  analysis:
                    type: object
                    required:
                      - schema
                      - timestamp
                      - version
                      - duration
                      - status
                      - report
                    properties:
                      schema:
                        type: string
                        enum:
                          - '2'
                        nullable: true
                        description: >-
                          Version of the report schema. Version number is
                          incremented to indicate a break of backwards
                          compatibility.
                      timestamp:
                        type: string
                        format: date-time
                        nullable: true
                        description: >-
                          Indicates when the file was last analyzed in ISO-8601
                          time format.
                      version:
                        type: string
                        example: 5.0.0.0
                        nullable: true
                        description: >-
                          Version of the analysis engine that was used to
                          inspect the file.
                      duration:
                        type: string
                        example: '00:07:49.859'
                        nullable: true
                        description: >-
                          Indicates how long it took to complete the analysis
                          step.
                      status:
                        type: string
                        enum:
                          - SECURING
                          - IMPORTING
                          - PROCESSING
                          - DONE
                          - ERROR
                        example: DONE
                        description: Indicates the analysis status for the requested file.
                      report:
                        $ref: '#/components/schemas/AnalysisReport'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UnsupportedBuildParameter:
                  value:
                    error: File Stream files do not support the 'build' parameter.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /checks/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    get:
      operationId: getFilestreamFileChecks
      summary: Show performed checks
      description: >-
        Displays all checks that were performed for the processed File Stream
        file.
      tags:
        - File Stream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - analysis
                properties:
                  analysis:
                    type: object
                    required:
                      - schema
                      - timestamp
                      - version
                      - duration
                      - report
                    properties:
                      schema:
                        type: integer
                        enum:
                          - 1
                        description: >-
                          Version of the report schema. Version number is
                          incremented to indicate a break of backwards
                          compatibility.
                      timestamp:
                        type: string
                        format: date-time
                        description: >-
                          Indicates when the file was last analyzed in ISO-8601
                          time format.
                      version:
                        type: string
                        example: 5.0.0.0
                        description: >-
                          Version of the analysis engine that was used to
                          inspect the file.
                      duration:
                        type: string
                        example: '00:07:49.859'
                        description: >-
                          Indicates how long it took to complete the analysis
                          step.
                      report:
                        $ref: '#/components/schemas/ChecksReport'
        '202':
          $ref: '#/components/responses/ChecksWithoutAnalysis'
        '400':
          $ref: '#/components/responses/FilestreamUnsupportedParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /report/{organization}/{group}/{report_type}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - in: path
        name: report_type
        required: true
        schema:
          type: string
          enum:
            - cyclonedx
            - rl-checks
            - rl-cve
            - rl-json
            - rl-summary-pdf
            - rl-uri
            - sarif
            - spdx
          description: >-
            Specify the report type to export. The API returns the report
            contents in the response.
      - $ref: '#/components/parameters/file_id'
    get:
      operationId: getFilestreamReport
      summary: Export analysis report
      description: >-
        Download the analysis report in the format specified with `report_type`
        for the specified File Stream file.

        Report format documentation:


        - [CycloneDX](https://cyclonedx.org/specification/overview/)

        - [rl-checks](https://docs.secure.software/cli/rl-checks-schema)

        - [rl-cve](https://docs.secure.software/cli/rl-cve-schema)

        - [rl-json](https://docs.secure.software/cli/rl-json-schema)

        -
        [rl-summary-pdf](https://docs.secure.software/safe/report/report-summary)

        - [rl-uri](https://docs.secure.software/cli/rl-uri-schema)

        - [SARIF](https://docs.oasis-open.org/sarif/sarif/v2.0/sarif-v2.0.html)

        - [SPDX](https://spdx.github.io/spdx-spec/)


        The `rl-summary-pdf` report is returned as a PDF file
        (`application/pdf`), the `rl-cve` and `rl-uri` reports as CSV
        (`text/csv`), and all other reports as JSON (`application/json`).


        Only one report type can be downloaded per request.
      tags:
        - File Stream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/ReportProcessingNotDone'
        '400':
          $ref: '#/components/responses/FilestreamUnsupportedParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /pack/safe/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    get:
      operationId: getRlSafeFilestreamArchive
      summary: Export RL-SAFE archive
      description: >-
        Download the RL-SAFE archive for the specified File Stream file.

        Report format documentation:


        -
        [rl-safe](https://docs.secure.software/concepts/analysis-reports#rl-safe-archive)


        The archive is produced during analysis. Files analyzed before RL-SAFE
        support was enabled for

        File Stream do not have one; reprocess the file to generate it.
      tags:
        - File Stream
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - download_link
                  - file_name
                  - expiration_timestamp
                properties:
                  download_link:
                    type: string
                  file_name:
                    type: string
                  expiration_timestamp:
                    type: string
                    format: date-time
                    example: '2024-11-26T06:48:39.412093+00:00'
        '202':
          $ref: '#/components/responses/ReportWithoutAnalysis'
        '400':
          $ref: '#/components/responses/FilestreamUnsupportedParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /delete/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    delete:
      operationId: deleteFilestreamFile
      summary: Delete a file
      description: >-
        Delete a file that was previously uploaded or imported into the File
        Stream area of a group. When you delete a File Stream file, all its
        metadata and analysis reports are removed from the Portal. Only one file
        can be deleted per request.
      tags:
        - File Stream
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/FilestreamUnsupportedParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileDoesntExist'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /approve/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    put:
      operationId: approveFilestreamFile
      summary: Approve a file
      description: >-
        Approves a file in the File Stream area of a group. The file must have
        the 'Undetermined' or 'Rejected' approval status to be approved.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/ApproveRequest'
      responses:
        '200':
          description: Approved
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a file with the 'Undetermined' and 'Rejected'
                      approval statuses can be approved
                FileNotProcessed:
                  $ref: '#/components/examples/FileNotProcessed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileDoesntExist'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /reject/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    put:
      operationId: rejectFilestreamFile
      summary: Reject file approval
      description: >-
        Rejects approval for a file in the File Stream area of a group. The file
        must have the 'Undetermined' approval status to be rejected.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/RejectRequest'
      responses:
        '200':
          description: Rejected approval
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a file with the 'Undetermined' approval status can be
                      rejected
                FileNotProcessed:
                  $ref: '#/components/examples/FileNotProcessed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileDoesntExist'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /revoke/{organization}/{group}/filestream/{file_id}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/file_id'
    put:
      operationId: revokeFilestreamFile
      summary: Revoke file approval
      description: >-
        Revokes approval for a file in the File Stream area of a group. The file
        must have the 'Approved' approval status to be revoked.
      tags:
        - File Stream
      requestBody:
        $ref: '#/components/requestBodies/RevokeRequest'
      responses:
        '200':
          description: Revoked approval
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a file with the 'Approved' approval status can be
                      revoked
                FileNotProcessed:
                  $ref: '#/components/examples/FileNotProcessed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FilestreamFileDoesntExist'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/list/{organization}/{group}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
    get:
      operationId: listCatalogPackages
      summary: List packages in group catalog
      description: >-
        Lists every package published in the group's software catalog, with the
        external catalog it was imported from, if any. Unpublished packages,
        including imported packages without an approved version, are not listed.
      tags:
        - Catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - packages
                properties:
                  packages:
                    type: array
                    description: >-
                      Published packages, ordered by project name and package
                      name.
                    items:
                      $ref: '#/components/schemas/CatalogPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/publish/{organization}/{group}/pkg:rl/{project}/{package}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
    put:
      operationId: publishPackageToCatalog
      summary: Publish package to group catalog
      description: >-
        Adds a package to the group's software catalog, which offers its latest
        approved version to the organization. The package must have at least one
        approved version. Packages imported from an external catalog are
        published automatically the first time one of their versions is
        approved; use this endpoint to publish packages you built yourself, or
        to publish an imported package again after it was unpublished.
        Publishing a package that is already published has no effect.
      tags:
        - Catalog
      responses:
        '200':
          description: The package is in the catalog
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoApprovedVersion:
                  value:
                    error: >-
                      Only packages with at least one approved version can be
                      published to the catalog.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: unpublishPackageFromCatalog
      summary: Remove package from group catalog
      description: >-
        Removes a package from the group's software catalog. The package, its
        versions and analysis results are kept, and you can publish it again at
        any time. A package imported from an external catalog is not published
        again automatically after you unpublish it, even when newer versions are
        approved. Unpublishing a package that is not published has no effect.
      tags:
        - Catalog
      responses:
        '204':
          description: The package is not in the catalog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/list/{catalog}:
    parameters:
      - $ref: '#/components/parameters/catalog'
    get:
      operationId: getExternalCatalog
      summary: List external catalog contents
      description: >-
        Returns the full document of an external software catalog: every
        software entry with its streams, versions and files. Use it to choose
        what to import; the import endpoint takes an entry's `id` and the `id`
        of one of its streams. The document is the same for every group.
      tags:
        - Catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCatalogDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/import/{organization}/{group}/{catalog}/pkg:rl/{project}/{package}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/catalog'
    post:
      operationId: importFromCatalog
      summary: Import package from external catalog
      description: >-
        Creates a package from software in an external catalog and imports the
        selected versions, creating the project if it does not exist. Pick the
        software and one of its streams from the catalog document. The package
        stays linked to the catalog, so newer versions can be imported later
        with the catalog update endpoint or automatically. A package keeps at
        most 16 versions; importing more deletes the oldest, including approved
        ones. Versions are analyzed in the background (check progress with the
        version status endpoint) and count against the group's analysis
        capacity.
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StreamAlreadyImported:
                  value:
                    error: >-
                      This catalog package has already been imported into the
                      group for this artifact stream
                UnknownStream:
                  value:
                    error: Software declares no stream
                VersionNotInStream:
                  value:
                    error: Version has no artifact for the selected stream
                NothingImportable:
                  value:
                    error: The catalog stream has no versions that can be imported
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A package with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/update/{organization}/{group}/pkg:rl/{project}/{package}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
    post:
      operationId: updateFromCatalog
      summary: Update package from external catalog
      description: >-
        Imports versions from the external catalog into a package created by the
        catalog import endpoint. Without `versions`, imports all versions newer
        than the package's newest one. Not available while automatic sync is on
        for the package. A package keeps at most 16 versions; importing more
        deletes the oldest, including approved ones. Versions are analyzed in
        the background (check progress with the version status endpoint) and
        count against the group's analysis capacity.
      tags:
        - Catalog
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogUpdateRequest'
      responses:
        '200':
          description: Nothing newer to import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResult'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotLinked:
                  value:
                    error: Package is not linked to an external catalog
                AutomaticSyncEnabled:
                  value:
                    error: >-
                      New versions are synced automatically; turn off automatic
                      sync to import versions manually
                VersionNotInStream:
                  value:
                    error: Version has no artifact for the selected stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version already exists in the package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /catalog/detach/{organization}/{group}/pkg:rl/{project}/{package}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
    delete:
      operationId: detachFromCatalog
      summary: Detach package from external catalog
      description: >-
        Unlinks a package from the external catalog it was imported from. The
        package and its versions are kept, but are no longer updated from the
        catalog.
      tags:
        - Catalog
      responses:
        '204':
          description: Detached
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotLinked:
                  value:
                    error: Package is not linked to an external catalog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  schemas:
    FilestreamFileReference:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Server-generated ID of the File Stream file. Use it with the other
            File Stream endpoints.
          example: 57f70f86-71ea-43f8-b443-515d911c8d4a
    FilestreamFile:
      type: object
      required:
        - id
        - file_name
        - created
        - user
        - status
        - approval_status
        - imported_from
        - days_until_deletion
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated ID of the File Stream file.
          example: 57f70f86-71ea-43f8-b443-515d911c8d4a
        file_name:
          type: string
          example: upload.exe
          description: User-specified name for the file uploaded to the File Stream.
        created:
          type: string
          format: date-time
          description: >-
            Indicates when the file was uploaded or imported, in ISO-8601 time
            format.
        user:
          type: string
          nullable: true
          description: Email address of the user who uploaded or imported the file.
          example: user@example.com
        status:
          type: string
          enum:
            - SECURING
            - IMPORTING
            - PROCESSING
            - DONE
            - ERROR
          description: Current processing status of the file.
        approval_status:
          type: string
          enum:
            - Undetermined
            - Approved
            - ApprovedAutomatically
            - ApprovalRejected
            - ApprovalRevoked
          description: Approval status of the file.
        imported_from:
          type: string
          nullable: true
          description: >-
            URL the file was imported from. If the file was uploaded directly,
            the value is null.
        days_until_deletion:
          type: integer
          nullable: true
          description: >-
            Number of days until the Portal retention policy automatically
            deletes the file. If automatic file removal is disabled on the
            Portal, the value is null.
    VersionMetadataVersion:
      type: string
      example: 1.0.0
      maxLength: 200
      default: Generic
      description: >-
        Software version recorded in the file's software information. Must be a
        valid PURL component.
    TPRMReason:
      type: object
      required:
        - reason
      properties:
        reason:
          description: User-specified reason for changing the approval status.
          type: string
          minLength: 1
          maxLength: 500
    OrganizationUsage:
      type: object
      required:
        - time_to_capacity_reset_seconds
        - max_packages
        - package_count
        - total_capacity_bytes
        - total_capacity_bytes_portal
        - this_month_used_bytes_portal
        - total_capacity_bytes_cli
        - this_month_used_bytes_cli
        - download_capacity_bytes
        - downloaded_this_month_bytes
        - promo_capacity_bytes
        - entitlements
      properties:
        time_to_capacity_reset_seconds:
          description: Number of seconds until analysis capacity resets.
          type: integer
          example: 259200
        max_packages:
          description: Maximum number of packages the organization can have.
          type: integer
          example: 10000
        package_count:
          description: Number of packages in the organization.
          type: integer
          example: 1000
        total_capacity_bytes:
          description: Analysis capacity for the organization (Portal + CLI + Flex).
          type: integer
          example: 1181116006400
        total_capacity_bytes_portal:
          description: Portal capacity bytes in the organization without Flex.
          type: integer
          example: 536870912000
        this_month_used_bytes_portal:
          description: >-
            Total used bytes in the Portal in the organization in the current
            billing period.
          type: integer
          example: 40000000000
        total_capacity_bytes_cli:
          description: CLI capacity bytes in the organization without Flex.
          type: integer
          example: 536870912000
        this_month_used_bytes_cli:
          description: >-
            Total used bytes by CLI in the organization in the current billing
            period.
          type: integer
          example: 53687091200
        download_capacity_bytes:
          description: Portal download capacity bytes.
          type: integer
          example: 30000000000
        downloaded_this_month_bytes:
          description: >-
            Total downloaded bytes in the organization in the current billing
            period.
          type: integer
          example: 25000000000
        promo_capacity_bytes:
          description: >-
            Total Flex capacity bytes in the organization in the current billing
            period.
          type: integer
          example: 1073741824000
        entitlements:
          description: SAFE Assessment Entitlements
          type: object
          required:
            - hardening
            - licenses
            - malware
            - secrets
            - tampering
            - vulnerabilities
          properties:
            hardening:
              $ref: '#/components/schemas/Entitlement'
            licenses:
              $ref: '#/components/schemas/Entitlement'
            malware:
              $ref: '#/components/schemas/Entitlement'
            secrets:
              $ref: '#/components/schemas/Entitlement'
            tampering:
              $ref: '#/components/schemas/Entitlement'
            vulnerabilities:
              $ref: '#/components/schemas/Entitlement'
    ProjectUsageBytes:
      type: integer
      description: Analysis capacity used by all projects in the group, displayed in bytes.
      example: 40000000000
    ProjectUsageLimitBytes:
      type: integer
      nullable: true
      description: >-
        If any optional limits are configured for projects in the group,
        displays how much of the limit has been used in bytes.
      example: 200000
    FilestreamUsageBytes:
      type: integer
      description: Analysis capacity used by File Stream in the group, displayed in bytes.
      example: 40000000000
    FilestreamUsageLimitBytes:
      type: integer
      nullable: true
      description: >-
        If any optional limits are configured for File Stream in the group,
        displays how much of the limit has been used in bytes.
      example: 200000
    Schemas:
      type: object
      required:
        - schemas
      properties:
        schemas:
          type: array
          items:
            type: string
    Meta:
      type: object
      properties:
        resourceType:
          type: string
          description: The resource type name.
        created:
          type: string
          format: date-time
          description: The DateTime when the resource was created in the service provider.
        lastModified:
          type: string
          format: date-time
          description: The last DateTime this resource was updated at the service provider.
        location:
          type: string
          description: The URI of the returned resource.
        version:
          type: string
          description: The version of the returned resource.
    ListResponse:
      allOf:
        - $ref: '#/components/schemas/Schemas'
        - type: object
          properties:
            totalResults:
              type: integer
              description: The total number of items returned by the request.
            itemsPerPage:
              type: integer
              description: >-
                The number of resources included in a single page of a list
                response.
            startIndex:
              type: integer
              description: >-
                The position of the first result on the current page, where
                indexing starts at 1.
            Resources:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/User'
      default:
        schemas:
          - urn:ietf:params:scim:api:messages:2.0:ListResponse
      example:
        schemas:
          - urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults: 2
        itemsPerPage: 1
        startIndex: 1
        Resources:
          - schemas:
              - urn:ietf:params:scim:schemas:core:2.0:User
            id: 2819c223-7f76-453a-919d-413861904646
            userName: user@company.com
            meta:
              resourceType: User
              created: '2011-08-01T18:29:49.793Z'
              lastModified: '2011-08-01T18:29:49.793Z'
              location: >-
                https://example.com/v2/Users/2819c223-7f76-453a-919d-413861904646
            name:
              formatted: John Smith
              familyName: Smith
              givenName: John
            active: true
            displayName: John Smith
            emails:
              - value: john.smith@company.com
                primary: true
            groups: []
    CommonAttributes:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            A unique identifier assigned by the service provider to identify a
            SCIM resource.
    User:
      allOf:
        - $ref: '#/components/schemas/Schemas'
        - $ref: '#/components/schemas/CommonAttributes'
        - type: object
          required:
            - userName
          properties:
            userName:
              $ref: '#/components/schemas/UserName'
            name:
              $ref: '#/components/schemas/name'
            displayName:
              type: string
              description: Displayed name of the user.
            active:
              $ref: '#/components/schemas/UserActive'
            emails:
              $ref: '#/components/schemas/UserEmails'
            groups:
              type: array
              description: Not implemented; always returns an empty array.
              items:
                type: object
            meta:
              $ref: '#/components/schemas/Meta'
    CreateUser:
      allOf:
        - $ref: '#/components/schemas/Schemas'
        - $ref: '#/components/schemas/CommonAttributes'
        - type: object
          properties:
            userName:
              $ref: '#/components/schemas/UserName'
            name:
              $ref: '#/components/schemas/name'
            active:
              $ref: '#/components/schemas/UserActive'
            emails:
              $ref: '#/components/schemas/UserEmails'
    UpdateUser:
      allOf:
        - $ref: '#/components/schemas/Schemas'
        - type: object
          properties:
            name:
              type: object
              description: Full name of the user.
              properties:
                familyName:
                  $ref: '#/components/schemas/FamilyName'
                givenName:
                  $ref: '#/components/schemas/GivenName'
            active:
              $ref: '#/components/schemas/UserActive'
    name:
      type: object
      description: Full name of the user.
      properties:
        formatted:
          type: string
          description: Full formatted name of the user.
          example: John Smith
        familyName:
          $ref: '#/components/schemas/FamilyName'
        givenName:
          $ref: '#/components/schemas/GivenName'
    MultiValuedAttributes:
      type: object
      properties:
        value:
          type: string
          description: Attribute value.
        primary:
          type: boolean
          description: Preferred attribute value.
          default: true
    PatchRequest:
      allOf:
        - $ref: '#/components/schemas/Schemas'
        - type: object
          required:
            - Operations
          properties:
            Operations:
              type: array
              description: An array of one or more PATCH operations.
              items:
                type: object
                required:
                  - op
                properties:
                  op:
                    type: string
                    enum:
                      - replace
                    description: The operation to perform on the user.
                  path:
                    type: string
                    enum:
                      - active
                      - givenName
                      - familyName
                      - name.givenName
                      - name.familyName
                    description: The target of the operation.
                  value:
                    oneOf:
                      - type: string
                      - type: boolean
                      - type: object
                        properties:
                          active:
                            type: boolean
                          name.givenName:
                            type: string
                          name.familyName:
                            type: string
                          givenName:
                            type: string
                          familyName:
                            type: string
                        example:
                          active: true
                    description: The value to be replaced.
