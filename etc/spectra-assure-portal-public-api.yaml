openapi: 3.0.3
info:
  title: ReversingLabs Spectra Assure Portal API
  version: '1.0'
  contact:
    name: ReversingLabs Support
    url: https://www.reversinglabs.com/
    email: support@reversinglabs.com
  license:
    name: Proprietary
    url: https://www.reversinglabs.com/hubfs/ReversingLabs_MLSA.pdf
  description: >+
    # About the API


    ReversingLabs Spectra Assure Portal is a SaaS solution for comprehensive and
    collaborative software development management. 

    With the Portal, you can scan your software packages, organize them into
    projects, and automatically compare package versions to detect potentially
    dangerous behavior changes in the code. 

    The Portal is designed to help you improve security of your development
    practices and software release processes from start to finish.


    The Spectra Assure Portal API is a companion solution to the Portal. 

    It allows you to automate common actions such as creating projects and
    packages, uploading package versions, and exporting analysis reports in
    supported formats.


    ## API versioning


    The current Portal API version is **v1**, which is indicated in all request
    paths.


    ## Servers


    All request paths use the following server URL format:


    `https://{portalUrl}/api/public/{apiVersion}`


    where `{portalUrl}` is the URL of the Portal instance that you want to
    access from the API. 


    By default, the Portal instance will be a subdirectory of
    `my.secure.software`.

    Depending on your region, replace `my` with one of the following:


    - `ca`, for Canada 

    - `us`, for USA (interchangeable with `my`) 


    Therefore, an example `{portalUrl}` could be `my.secure.software/demo` or
    `{region}.secure.software/demo`.


    With that example, the full server URL would be:


    `https://my.secure.software/demo/api/public/v1` or
    `https://{region}.secure.software/demo/api/public/v1`


    All requests must be made over HTTPS. This API does not support HTTP.



    ## Authentication


    All endpoints in the Portal API require Bearer authentication.


    To authenticate to the API, you need to create a Personal Access Token in
    your Portal account settings.


    The Personal Access Token must be provided in the `Authorization: Bearer`
    HTTP header of every request. 


    Make sure to treat your tokens as confidential. If you suspect any of your
    tokens has been compromised, revoke it in your Portal account settings and
    generate a new one. 



    ## Rate limiting


    To ensure safe and stable service operation, ReversingLabs enforces rate
    limits on all Portal API endpoints.


    Two types of rate limits apply:


    - **Sustain limit** = maximum allowed volume of continuous requests over a
    period of time


    - **Burst limit** = maximum allowed amount of concurrent requests in a short
    time interval


    All rate limits are enforced per user, with each user identified by their
    Personal Access Token.


    Rate limiting is implemented as a "hard stop" on API endpoint usage.

    Users who exceed a rate limit receive the `429 Too Many Requests` error
    response and cannot make any requests until the service becomes available
    again.

    The `Retry-After` [HTTP
    header](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Retry-After)
    in the response indicates how many seconds to wait before sending the
    request again.


    The following table provides an overview of all rate limits that apply to
    your API usage.



    | API endpoint | Rate limit |

    | :--------- | ------ |

    | All endpoints | Sustain limit: **86400 requests in the last 24 hours per
    user** across all endpoints combined. |

    | All endpoints | Burst limit: **300 requests / minute per user** across all
    endpoints combined. |

    | [Upload and scan a
    version](https://docs.secure.software/api-reference/#tag/Version/operation/scanVersion)
    | **30 requests / minute** |

    | [Show analysis
    status](https://docs.secure.software/api-reference/#tag/Version/operation/getVersionStatus)
    | **10 requests / minute** when using the `download` query parameter to
    request the file download link. |

    | [Export analysis
    report](https://docs.secure.software/api-reference/#tag/Version/operation/getVersionReport)
    | **30 requests / minute** |



    Rate limits are cumulative - a single request counts towards all rate limits
    that apply.

    For example, if the burst limit is 3 requests/minute and the sustain limit
    is 100 requests within 24 hours, sending 5 requests in under a minute will
    exceed the burst limit *and* will count towards the sustain limit.


    If you notice the API rate limits are not properly set for your Spectra
    Assure Portal account, contact [ReversingLabs
    Support](mailto:support@reversinglabs.com).




    ## Responses and error handling


    Successful requests return `2xx` status codes.


    Errors are indicated by `4xx` and `5xx` status codes. 

    In some cases, the JSON response will contain a more informative message
    about the problem in the `error` key.

    Expected responses and status codes are listed for every endpoint in this
    reference documentation.


    The following table provides an overview of all expected error responses and
    suggested resolution steps.


    | Status code | Description |

    | :--------- | ------ |

    | `400 Bad request` | Usually indicates a syntax error in the request.
    Confirm that all parts of your request are correctly formatted and make sure
    you're not using any unsupported characters.  |

    | `401 Not authorized` | The service is not able to authenticate you with
    the information provided in the request. This may be caused by a missing,
    malformed, expired, or revoked token. Make sure you're correctly providing
    the token in the `Authorization: Bearer` header in your requests. |

    | `402 Insufficient remaining capacity` | Usually indicates a licensing
    issue. The service is not able to fulfill your request because it would
    exceed the capacity configured for your organization and groups in the
    Portal. Contact your Organization Administrator for help, or review the
    usage reservations in Settings > Analysis Capacity in the Portal interface.
    |

    | `403 Forbidden` | You don't have permission to access the requested
    resource. This may be because the Portal account associated with your token
    does not have the correct role assigned to it, or the resource is outside of
    its scope. Check if you can perform the requested action directly in the
    Portal interface instead of with the API. If the issue persists, contact
    your Organization Administrator for help. |

    | `404 Not found` | The resource you're trying to access doesn't exist in
    the Portal. Check if the endpoint is correctly formatted in your request,
    and make sure all required parameters are present. This response is also
    returned if an unsupported protocol is used in the request (for example,
    HTTP instead of HTTPS). |

    | `409 Resource already exists` | Project, package, or version you're trying
    to create already exists in the Portal. Try to change the name of the
    resource in a new request. For versions, you can use the `replace` query
    parameter to overwrite an existing version. |

    | `429 Too many requests` | The service detected an excessive amount of
    requests from your account in a short period. You may have exceeded the rate
    limits defined in the ["Rate
    limiting"](https://docs.secure.software/api-reference/#section/About-the-API/Rate-limiting)
    section. Review the tools and applications you use to work with the API to
    make sure they're not sending redundant requests. |

    | `500 Internal server error` | Usually indicates an issue with the service
    itself. Try re-sending your request later. If the issue persists, contact
    ReversingLabs Support. |

servers:
  - url: https://{portalUrl}/api/public/v1
    variables:
      portalUrl:
        description: >-
          URL of the Portal instance that you want to access from the API. By
          default, the Portal instance will be a subdirectory of
          `my.secure.software`. Depending on your region, replace `my` with one
          of the following - `ca` (for Canada), `us` (for USA; interchangeable
          with `my`).
        default: my.secure.software/example
        enum:
          - my.secure.software/example
          - ca.secure.software/example
          - us.secure.software/example
security:
  - TokenAuthentication: []
x-tagGroups:
  - name: Portal File Stream
    tags:
      - File Stream
  - name: Portal Projects
    tags:
      - Version
      - Project
      - Package
      - Approval
      - Catalog
  - name: Portal Administration
    tags:
      - Group
      - Profile
      - SCIM
      - Audit
  - name: Spectra Assure Community
    tags:
      - Community
tags:
  - name: Version
    description: >-
      **Endpoints in this category help you work with software package versions
      in your Portal projects.**
  - name: Project
    description: >-
      **Endpoints in this category help you manage your projects in the
      Portal.**
  - name: Package
    description: >-
      **Endpoints in this category help you manage software packages in your
      Portal projects.**
  - name: Group
    description: >-
      **Endpoints in this category make it easier to work with groups in the
      Portal.**
  - name: Approval
    description: >-
      **Endpoints in this category help you manage the approval status for
      software package versions in the Portal.**


      The following table explains which approval flows are supported by these
      API endpoints.


      | Approval flow | API | Details |

      | --------- | :---: | ---- |

      | Approval Pending -> Approved  | ✔️ | By default, all package versions
      await approval and can be approved. |

      | Approval Pending -> Rejected | ✔️ | By default, all package versions
      await approval and can be rejected. |

      | Approval Pending -> Revoked | ❌ | There is nothing to revoke if the
      package version has not been approved yet. |

      | Approved -> Revoked | ✔️ | A previously approved package version can
      have its approval status revoked. |

      | Approved -> Rejected | ❌ | Contradictory action; use the revoke option
      instead. |

      | Approved -> Approval Pending | ❌ | Approval status cannot be reset to
      the initial (undetermined) state. |

      | Rejected -> Approved | ✔️ | A previously rejected package version can be
      approved. |

      | Rejected -> Revoked | ❌ | There is nothing to revoke if the package
      version is not approved. |

      | Rejected -> Approval Pending | ❌ | Approval status cannot be reset to
      the initial (undetermined) state. |

      | Revoked -> Approved | ❌ | Revoked package versions cannot be approved
      again. |

      | Revoked -> Rejected | ❌ | Revoked package versions cannot be rejected. |

      | Revoked -> Approval Pending | ❌ | Approval status cannot be reset to the
      initial (undetermined) state. |    
  - name: Community
    description: >-
      **Endpoints in this category let you interact with Spectra Assure
      Community.**


      ReversingLabs [Spectra Assure
      Community](https://docs.secure.software/community/) is a free-to-use SaaS
      platform where software developers, DevOps engineers, and IT security
      specialists can check the security status of widely distributed developer
      tools and open source software packages from the most popular communities.
      The contents of these software package and developer tool repositories are
      continually analyzed by ReversingLabs with the latest findings immediately
      available on the Spectra Assure Community website. 


      The Spectra Assure Community API is an extension of the Community platform
      and a companion solution to the free SaaS tool.

      It allows you to automate common actions; specifically, searching for
      packages and retrieving information about individual software packages and
      their versions.


      These endpoints are also available to Spectra Intelligence customers as
      part of the [TCA-0701
      API](https://docs.reversinglabs.com/SpectraIntelligence/API-reference/#tag/Supply-Chain-Security).


      Error responses from Spectra Assure Community are returned with their
      original status code, as `{"error": "<Spectra Assure Community response
      body>"}`.
  - name: Profile
    description: >-
      **Endpoints in this category help you manage organization and group
      profile configurations.**


      With reusable profile configurations, users can preserve organization and
      group settings and reuse them across multiple Spectra Assure products.
      This ensures consistency across products and automatically applies any
      predefined customizations, reducing the risk of configuration errors and
      discrepancies.
  - name: SCIM
    description: >-
      **Endpoints in this category help you manage users in the Portal when SSO
      is active using the SCIM (System for Cross-domain Identity Management)
      integration.**


      A token associated with a Portal Organization Administrator account is
      required for authentication on every request. Before using these
      endpoints, a user with the **Organization Administrator** role must create
      a [**Personal Access
      Token**](https://docs.secure.software/api/generate-api-token#create-a-token)
      for SCIM integration.


      All changes to users are automatically visible on the
      [Members](/portal/members) page of your Portal instance.


      To learn more about using SCIM integrations, consult your identity
      provider documentation (for example,
      [Okta](https://developer.okta.com/docs/concepts/scim/#how-does-scim-work))
      or the official [SCIM resources](https://scim.cloud/).
  - name: Audit
    description: '**Endpoints in this category help you export audit logs from the Portal.**'
  - name: File Stream
    description: >-
      **Endpoints in this category help you automate actions available in the
      Portal File Stream.**
  - name: Catalog
    description: >-
      **Endpoints in this category help you curate the software catalog in the
      Portal.**
paths:
  /scan/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/build'
      - in: query
        name: replace
        required: false
        description: >-
          This optional parameter lets you replace (overwrite) an already
          existing package version in the project with the package version
          you're uploading. This functionality is equivalent to the `--replace`
          option in the `rl-secure scan` command. 


          If this parameter is omitted or set to **false** and the package
          version you're trying to upload already exists in the specified
          project, the API returns the 409 error response. 
        schema:
          type: boolean
          default: false
      - in: query
        name: force
        required: false
        description: >-
          In the Portal, a package can only have a limited amount of versions.
          If a package already has the maximum number of versions, you can use
          this optional parameter to specify if the oldest version of the
          package should be deleted to make space for the version you're
          uploading. 


          If this parameter is omitted or set to **false** and the package
          already has the maximum allowed number of versions, the API returns
          the 400 error response. 


          This parameter is incompatible with `build=repro` and `replace=true`.
        schema:
          type: boolean
          default: false
      - in: query
        name: diff_with
        required: false
        description: >-
          This optional parameter lets you specify a previous package version
          against which you want to compare (diff) the version you're uploading.
          The specified version must exist in the package. This functionality is
          equivalent to the `--diff-with` option in the `rl-secure report`
          command. Versions connected to the specified version that were
          analyzed with an older engine version or a different policy
          configuration, or have no completed analysis, are reanalyzed as well,
          and their reports are updated with the new results.


          This parameter is incompatible with `build=repro`.
        schema:
          $ref: '#/components/schemas/DiffWithVersion'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
      - $ref: '#/components/parameters/content_disposition'
      - in: header
        name: Content-Length
        required: false
        description: >-
          Specify the size of the uploaded file in bytes. If it is larger than
          the available quota, the API returns the 402 error response. Can be
          omitted when the file is sent with `Transfer-Encoding: chunked`.
          Chunked uploads must use `Content-Type: application/octet-stream`.
        schema:
          type: string
          example: '524288'
    post:
      operationId: scanVersion
      summary: Upload and scan a version
      description: >-
        Scan a file and add it as a new package version to a project in the
        Portal. If the project or package specified in the request don't exist
        in the Portal, they will be automatically created. A package imported
        from an external catalog cannot receive new versions through this
        endpoint; use the **Catalog update** endpoint instead.


        For a file to be successfully uploaded and analyzed on the Portal, your
        group must have enough available [analysis
        capacity](https://docs.secure.software/portal/analysis-capacity). The
        file size you want to upload must not exceed any configured group
        limits.


        If the package version specified in the request already exists in the
        package, the API returns the 409 error response. You can repeat the
        request with the `replace` parameter in the query to overwrite the
        existing version.


        To add a reproducible build artifact to an existing package version, use
        the `build` query parameter set to the `repro` value (`?build=repro`).
        If a reproducible build artifact already exists for a package version,
        the API returns a 400 error response. In this case, you should repeat
        the request with the `replace` query parameter set to `true`.


        Only one file (main package version artifact or reproducible build
        artifact) can be uploaded per request.


        If the uploaded file is linked to other versions of the package (through
        `diff_with`, or as a reproducible build with `build=repro`), linked
        versions that were analyzed with an older engine version or a different
        policy configuration, or have no completed analysis, are reanalyzed as
        well.
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >-
            curl -L
            'https://your-portal-url/api/public/v1/scan/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows'
            \

            -H 'Authorization: Bearer your-personal-access-token' \

            -H 'Content-Type: application/octet-stream' \

            -H 'Content-Disposition: attachment; filename=7z1514-x64.msi' \

            --data-binary '@/home/armando/software/7z1514-x64.msi' \
        - lang: python
          label: Python - Requests
          source: >-
            import requests


            url =
            "https://your-portal-url/api/public/v1/scan/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows"


            payload = open("/home/armando/software/7z1514-x64.msi", 'rb')


            headers = {
              'Content-Disposition': 'attachment; filename=7z1514-x64.msi',
              'Authorization': 'Bearer your-personal-access-token',
              'Content-Type': 'application/octet-stream'
            }


            response = requests.request("POST", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var fs = require('fs');
            var options = {
              'method': 'POST',
              'url': 'https://your-portal-url/api/public/v1/scan/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows',
              'headers': {
                'Authorization': 'Bearer your-personal-access-token',
                'Content-Disposition': 'attachment; filename=7z1514-x64.msi',
                'Content-Type': 'application/octet-stream'
              },
              body: "<file contents here>"
              
            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      requestBody:
        $ref: '#/components/requestBodies/FileUpload'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MaxNumberOfVersionsInPackage:
                  $ref: '#/components/examples/MaxNumberOfVersionsInPackage'
                ReplaceVersionWithExistingDescendants:
                  $ref: '#/components/examples/ReplaceVersionWithExistingDescendants'
                InvalidPreviousVersion:
                  $ref: '#/components/examples/InvalidPreviousVersion'
                NoOrganization:
                  $ref: '#/components/examples/NoOrganization'
                NoGroup:
                  $ref: '#/components/examples/NoGroup'
                UnsupportedCharacter:
                  $ref: '#/components/examples/UnsupportedCharacter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionAlreadyExists'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /url-import/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - in: query
        name: max_size
        required: false
        schema:
          type: integer
          description: >-
            The maximum file size that the Portal will attempt to download from
            the specified URL, in bytes. Keep in mind that the file size
            estimate before the download starts can be unreliable.
      - $ref: '#/components/parameters/replace'
      - in: query
        name: force
        required: false
        description: >-
          In the Portal, a package can only have a limited amount of versions.
          If a package already has the maximum number of versions, you can use
          this optional parameter to specify if the oldest version of the
          package should be deleted to make space for the version you're
          uploading. If this parameter is set to **false** and the package
          already has the maximum allowed number of versions, the API returns
          the 400 error response. This parameter is incompatible with
          `replace=true`.
        schema:
          type: boolean
          default: false
      - in: query
        name: diff_with
        required: false
        description: >-
          This optional parameter lets you specify a previous package version
          against which you want to compare (diff) the version you're uploading.
          The specified version must exist in the package. This functionality is
          equivalent to the `--diff-with` option in the `rl-secure report`
          command. Versions connected to the specified version that were
          analyzed with an older engine version or a different policy
          configuration, or have no completed analysis, are reanalyzed as well,
          and their reports are updated with the new results.
        schema:
          $ref: '#/components/schemas/DiffWithVersion'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
    post:
      operationId: importVersion
      summary: Import a version from URL
      description: >-
        Specify a URL from which to download a file and import it as a new
        package version into the Portal. If the project or package specified in
        the request don't exist in the Portal, they will be automatically
        created. A package imported from an external catalog cannot receive new
        versions through this endpoint; use the **Catalog update** endpoint
        instead.


        Only one package version can be imported per request.


        To successfully import and analyze a file from a URL:


        - check that the source type is supported in the [Supported URLs and
        PURLs](https://docs.secure.software/portal/filestream#supported-urls-and-purls)
        list

        - make sure your group has enough available [analysis
        capacity](https://docs.secure.software/portal/analysis-capacity). The
        file size you want to import must not exceed any configured group
        limits. You can use the optional query parameter `max_size` to limit the
        size of the imported file if necessary


        Only Support, Organization Admin, Group Owner, and Maintainer roles can
        import a package version. 


        If the package version specified in the request already exists in the
        package, the API returns the 409 error response. You can repeat the
        request with the `replace` parameter in the query to overwrite the
        existing version.


        Some servers may require authentication for file downloads from URLs. In
        that case, you should use either the `auth-user` and `auth-pass` or the
        `bearer-token` parameters in the request body. Usernames, passwords, and
        tokens provided through those authentication options are never stored in
        Spectra Assure products. They are forwarded directly to the service that
        requests authentication to start the file download.     
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >-
            curl -L
            'https://your-portal-url/api/public/v1/url-import/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows'
            \

            -H 'Content-Type: application/json' \

            -H 'Authorization: Bearer your-personal-access-token' \

            -d '{
                "url": "https://www.7-zip.org/a/7z2500-x64.exe"
            }'
        - lang: python
          label: Python - Requests
          source: >-
            import requests

            import json


            url =
            "https://your-portal-url/api/public/v1/url-import/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows"


            payload = json.dumps({
              "url": "https://www.7-zip.org/a/7z2500-x64.exe"
            })


            headers = {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer your-personal-access-token'
            }


            response = requests.request("POST", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'POST',
              'url': 'https://your-portal-url/api/public/v1/url-import/your-organization/your-group/pkg:rl/your-project/your-package@version?product=7zip&platform=Windows',
              'headers': {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer your-personal-access-token'
              },
              body: JSON.stringify({
                "url": "https://www.7-zip.org/a/7z2500-x64.exe"
              })

            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      requestBody:
        $ref: '#/components/requestBodies/UrlImport'
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MaxNumberOfVersionsInPackage:
                  value:
                    error: Package has reached the maximum number of versions
                ReplacingVersionWithExistingDescendants:
                  $ref: '#/components/examples/ReplaceVersionWithExistingDescendants'
                InvalidPreviousVersion:
                  $ref: '#/components/examples/InvalidPreviousVersion'
                MaxFileSizeExceeded:
                  $ref: '#/components/examples/MaxFileSizeExceeded'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionAlreadyExists'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /purl-import/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/replace'
      - in: query
        name: force
        required: false
        description: >-
          In Spectra Assure Portal, a package can only have a limited amount of
          versions. If a package already has the maximum number of versions, you
          can use this optional parameter to specify if the oldest version of
          the package should be deleted to make space for the version you're
          uploading. If this parameter is set to **false** and the package
          already has the maximum allowed number of versions, the API returns
          the 400 error response. This parameter is incompatible with
          `replace=true`.
        schema:
          type: boolean
          default: false
      - in: query
        name: diff_with
        required: false
        description: >-
          This optional parameter lets you specify a previous package version
          against which you want to compare (diff) the version you're uploading.
          The specified version must exist in the package. This functionality is
          equivalent to the `--diff-with` option in the `rl-secure report`
          command. Versions connected to the specified version that were
          analyzed with an older engine version or a different policy
          configuration, or have no completed analysis, are reanalyzed as well,
          and their reports are updated with the new results.
        schema:
          $ref: '#/components/schemas/DiffWithVersion'
      - $ref: '#/components/parameters/product'
      - $ref: '#/components/parameters/publisher'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/license'
      - $ref: '#/components/parameters/platform'
      - $ref: '#/components/parameters/architecture'
      - $ref: '#/components/parameters/release_date'
      - $ref: '#/components/parameters/max_size'
    post:
      operationId: importVersionPURL
      summary: Import a version from PURL
      description: >-
        Specify a PURL from which to download a file and import it as a new
        package version into the Portal. If the project or package specified in
        the request don't exist in the Portal, they will be automatically
        created. A package imported from an external catalog cannot receive new
        versions through this endpoint; use the **Catalog update** endpoint
        instead.


        Only one package version can be imported per request.


        To successfully import and analyze a file from a PURL:


        - check that the source type is supported in the [Supported URLs and
        PURLs](https://docs.secure.software/portal/filestream#supported-urls-and-purls)
        list

        - make sure your group has enough available [analysis
        capacity](https://docs.secure.software/portal/analysis-capacity). The
        file size you want to import must not exceed any configured group
        limits. You can use the optional query parameter `max_size` to limit the
        size of the imported file if necessary


        Only Support, Organization Admin, Group Owner, and Maintainer roles can
        import a package version. 


        If the package version specified in the request already exists in the
        package, the API returns the 409 error response. You can repeat the
        request with the `replace` parameter in the query to overwrite the
        existing version.


        Some servers may require authentication for file downloads from PURLs.
        In that case, you should use either the `auth-user` and `auth-pass` or
        the `bearer-token` parameters in the request body. Usernames, passwords,
        and tokens provided through those authentication options are never
        stored in Spectra Assure products. They are forwarded directly to the
        service that requests authentication to start the file download. 
      tags:
        - Version
      requestBody:
        $ref: '#/components/requestBodies/PurlImport'
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                MaxNumberOfVersionsInPackage:
                  $ref: '#/components/examples/MaxNumberOfVersionsInPackage'
                ReplacingVersionWithExistingDescendants:
                  $ref: '#/components/examples/ReplaceVersionWithExistingDescendants'
                InvalidPreviousVersion:
                  $ref: '#/components/examples/InvalidPreviousVersion'
                MaxFileSizeExceeded:
                  $ref: '#/components/examples/MaxFileSizeExceeded'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionAlreadyExists'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /sync/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    post:
      operationId: syncVersion
      summary: Rescan a version
      description: >-
        Rescans the existing package version to synchronize it with the updated
        configuration or with the latest engine update. Other versions of the
        package linked to this version that were analyzed with an older engine
        version or a different policy configuration, or have no completed
        analysis, are reanalyzed as well. 


        Reanalyzing a package version does not count towards the monthly
        analysis capacity.


        When you request reanalysis from this endpoint, the Portal automatically
        detects configuration changes or engine updates that would require
        synchronization. If there haven't been any changes, reanalysis is
        skipped and the API returns the `200` response. This means you don't
        need to manually check for configuration changes or engine updates prior
        to requesting reanalysis.
      tags:
        - Version
      responses:
        '200':
          description: Version already in sync
          content:
            text/plain:
              example: Version already in sync
        '202':
          description: Sync started
          content:
            text/plain:
              example: Sync started
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /list/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    get:
      operationId: versionInfo
      summary: Show version details
      description: >-
        Display basic information about a package version that was previously
        uploaded to a project in the Portal. The information includes the
        current release status of the package version and the details about file
        approval for third-party risk management workflows.
      tags:
        - Version
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - version_id
                  - is_released
                  - software_info
                  - approval_status
                  - approval_information
                properties:
                  version:
                    type: string
                    example: 5.5.8
                  version_id:
                    $ref: '#/components/schemas/UUID'
                  is_released:
                    type: boolean
                    description: >-
                      Indicates whether the package version is marked as
                      released in the Portal.
                  software_info:
                    $ref: '#/components/schemas/SoftwareInfo'
                  approval_status:
                    $ref: '#/components/schemas/ApprovalStatusDisplay'
                  approval_information:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/ApprovalStatusInformation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /status/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/build'
      - $ref: '#/components/parameters/download'
    get:
      operationId: getVersionStatus
      summary: Show analysis status
      description: >-
        Check the analysis status of a package version that was previously
        uploaded to the Portal. If the version has been successfully analyzed,
        the response includes a summary of the analysis report. 


        To retrieve the full analysis report in any of the supported formats,
        use the **Export analysis report** endpoint.


        By default, this endpoint returns the status of the main
        (representative) artifact in the version. To check the status of a
        reproducible build artifact, use the `build` query parameter set to the
        `repro` value. If a reproducible build artifact doesn't exist for the
        requested package version, the API returns an error response.   


        Note that this endpoint returns the analysis status of the requested
        file (either the main package version artifact or the reproducible build
        artifact). It doesn't include details on the checks that were performed
        during analysis. To view that information, use the **Show performed
        checks** endpoint.


        Optionally, this endpoint can return a short-lived download link for the
        main artifact or the reproducible build artifact if the `download` query
        parameter is used. With the `build` query parameter, specify for which
        artifact the download link should be generated. If the `build` parameter
        is omitted from the request, the download link is generated for the main
        artifact. 


        The download link is valid only for 60 seconds, after which it can be
        requested again. Every time the download link is generated, the Portal
        Download Capacity is reduced by the artifact's file size, even if the
        artifact is not downloaded from the link. **To download the artifact,
        the user account that is sending the request must have the appropriate
        permissions.** If the user account doesn't have permission to download
        files from the Portal, the endpoint responds with an error and the
        Download Capacity remains unaffected.
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >-
            curl -L
            'https://your-portal-url/api/public/v1/status/your-organization/your-group/pkg:rl/your-project/your-package@version'
            \

            -H 'Authorization: Bearer your-personal-access-token'
        - lang: python
          label: Python - Requests
          source: >
            import requests


            url =
            "https://your-portal-url/api/public/v1/status/your-organization/your-group/pkg:rl/your-project/your-package@version"


            payload = {}

            headers = {
              'Authorization': 'Bearer your-personal-access-token'
            }


            response = requests.request("GET", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'GET',
              'url': 'https://your-portal-url/api/public/v1/status/your-organization/your-group/pkg:rl/your-project/your-package@version',
              'headers': {
                'Authorization': 'Bearer your-personal-access-token'
              }
            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - analysis
                properties:
                  analysis:
                    type: object
                    required:
                      - schema
                      - timestamp
                      - version
                      - duration
                      - status
                      - report
                    properties:
                      schema:
                        type: string
                        enum:
                          - '2'
                        nullable: true
                        description: >-
                          Version of the report schema. Version number is
                          incremented to indicate a break of backwards
                          compatibility.
                      timestamp:
                        type: string
                        format: date-time
                        nullable: true
                        description: >-
                          Indicates when the software package was last analyzed
                          in ISO-8601 time format.
                      version:
                        type: string
                        example: 5.0.0.0
                        nullable: true
                        description: >-
                          Version of the analysis engine that was used to
                          inspect the software package.
                      duration:
                        type: string
                        example: '00:07:49.859'
                        nullable: true
                        description: >-
                          Indicates how long it took to complete the analysis
                          step.
                      status:
                        type: string
                        enum:
                          - PROCESSING
                          - DONE
                          - ERROR
                          - SECURING
                          - IMPORTING
                        example: DONE
                        description: >-
                          Indicates the analysis status for the requested
                          package version.
                      report:
                        $ref: '#/components/schemas/AnalysisReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientRemainingCapacity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /checks/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
