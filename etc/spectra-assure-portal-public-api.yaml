            -H 'Authorization: Bearer your-personal-access-token'
        - lang: python
          label: Python - Requests
          source: >
            import requests


            url =
            "https://your-portal-url/api/public/v1/report/your-organization/your-group/report-type/pkg:rl/your-project/your-package@version"


            payload = {}

            headers = {
              'Authorization': 'Bearer your-personal-access-token'
            }


            response = requests.request("GET", url, headers=headers,
            data=payload)


            print(response.text)
        - lang: javascript
          label: NodeJS - Request
          source: |
            var request = require('request');
            var options = {
              'method': 'GET',
              'url': 'https://your-portal-url/api/public/v1/report/your-organization/your-group/report-type/pkg:rl/your-project/your-package@version',
              'headers': {
                'Authorization': 'Bearer your-personal-access-token'
              }
            };
            request(options, function (error, response) {
              if (error) throw new Error(error);
              console.log(response.body);
            });
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
              example: Contents of the report file in CSV format
            application/json:
              schema:
                type: object
              example: Contents of the report file in JSON format
            application/pdf:
              schema:
                type: string
                format: binary
              example: The report summary in PDF format
          headers:
            Content-Disposition:
              schema:
                type: string
              description: >-
                The default file name is different for each report format. All
                report file names are listed in the [supported report
                formats](https://docs.secure.software/concepts/analysis-reports#supported-report-formats)
                table.
              example: attachment; filename='report.type.json'
        '202':
          $ref: '#/components/responses/ReportProcessingNotDone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /pack/safe/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
