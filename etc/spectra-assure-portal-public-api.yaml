      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - analysis
                properties:
                  analysis:
                    type: object
                    required:
                      - schema
                      - timestamp
                      - version
                      - duration
                      - report
                    properties:
                      schema:
                        type: integer
                        enum:
                          - 1
                        description: >-
                          Version of the report schema. Version number is
                          incremented to indicate a break of backwards
                          compatibility.
                      timestamp:
                        type: string
                        format: date-time
                        example: '2024-03-25T10:07:27Z'
                        description: >-
                          Indicates when the software package was last analyzed
                          in ISO-8601 time format.
                      version:
                        type: string
                        example: 5.0.0.0
                        description: >-
                          Version of the analysis engine that was used to
                          inspect the software package.
                      duration:
                        type: string
                        example: '00:07:49.859'
                        description: >-
                          Indicates how long it took to complete the analysis
                          step.
                      report:
                        $ref: '#/components/schemas/ChecksReport'
        '202':
          $ref: '#/components/responses/ChecksWithoutAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /report/{organization}/{group}/{report_type}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/build'
      - in: path
        name: report_type
        required: true
        schema:
          type: string
          enum:
            - cyclonedx
            - rl-checks
            - rl-cve
            - rl-diff
            - rl-json
            - rl-summary-pdf
            - rl-uri
            - sarif
            - spdx
          description: >-
            Specify the report type to export. The API returns the report
            contents in the response.
    get:
      operationId: getVersionReport
      summary: Export analysis report
      description: >-
        Retrieve the analysis report in the format specified with `report_type`
        for the specified package version. Contents of the report are returned
        in the response. 


        By default, the endpoint returns the report for the main
        (representative) artifact in the package version. To get the report for
        a reproducible build artifact, use the `build` query parameter set to
        the `repro` value. The `build` parameter is **not supported for the
        rl-checks report format**.


        If a reproducible build artifact does not exist for the requested
        package version, the API returns a 400 error response.


        With this endpoint, you can get the following report formats:


        - [CycloneDX](https://cyclonedx.org/specification/overview/)

        - [rl-checks](https://docs.secure.software/cli/rl-checks-schema)

        - [rl-cve](https://docs.secure.software/cli/rl-cve-schema)

        - [rl-diff](https://docs.secure.software/cli/rl-diff-schema)

        - [rl-json](https://docs.secure.software/cli/rl-json-schema)

        -
        [rl-summary-pdf](https://docs.secure.software/safe/report/report-summary)

        - [rl-uri](https://docs.secure.software/cli/rl-uri-schema)

        - [SARIF](https://docs.oasis-open.org/sarif/sarif/v2.0/sarif-v2.0.html)

        - [SPDX](https://spdx.dev/specifications/)


        Only one report can be retrieved per request.


        To get the full SAFE report for the package version, use the [Download
        RL-SAFE
        archive](https://docs.secure.software/api-reference/#tag/Version/operation/getRlSafeVersionArchive)
        endpoint.
      tags:
        - Version
      x-codeSamples:
        - lang: bash
          label: Shell
          source: >-
            curl -L
            'https://your-portal-url/api/public/v1/report/your-organization/your-group/report-type/pkg:rl/your-project/your-package@version'
