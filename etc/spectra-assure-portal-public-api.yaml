                  - projects
                properties:
                  name:
                    $ref: '#/components/schemas/GroupName'
                  name_id:
                    $ref: '#/components/schemas/UUID'
                  projects:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - name_id
                      properties:
                        name:
                          description: Project name as created and displayed in the Portal.
                          type: string
                          example: My project
                        name_id:
                          $ref: '#/components/schemas/UUID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /usage/{organization}:
    parameters:
      - $ref: '#/components/parameters/organization'
    get:
      operationId: listOrganizationUsage
      summary: Usage details for an organization
      description: >-
        Return usage data for the specified organization and all groups the
        requesting user has the permission to access. 

        In the response, groups are listed in alphabetical order.


        For an organization, next to the information tied to [analysis
        capacity](https://docs.secure.software/portal/analysis-capacity), there
        is an entire **Entitlements** section that allows you to check which
        [SAFE Assessment
        categories](https://docs.secure.software/portal/analysis-capacity#entitlements)
        are enabled for your ReversingLabs cloud account and are evaluated
        during software analysis. 

        If you're using both Portal and CLI, same entitlement restrictions apply
        to both products.
      tags:
        - Group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - organization_usage
                  - groups_usage
                  - cli_usage
                properties:
                  organization_usage:
                    $ref: '#/components/schemas/OrganizationUsage'
                  groups_usage:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - projects_usage_bytes
                        - projects_usage_limit_bytes
                        - filestream_usage_bytes
                        - filestream_usage_limit_bytes
                      properties:
                        name:
                          $ref: '#/components/schemas/GroupName'
                        projects_usage_bytes:
                          $ref: '#/components/schemas/ProjectUsageBytes'
                        projects_usage_limit_bytes:
                          $ref: '#/components/schemas/ProjectUsageLimitBytes'
                        filestream_usage_bytes:
                          $ref: '#/components/schemas/FilestreamUsageBytes'
                        filestream_usage_limit_bytes:
                          $ref: '#/components/schemas/FilestreamUsageLimitBytes'
                  cli_usage:
                    type: object
                    description: >-
                      Detailed breakdown of CLI usage, separated into the global
                      shared pool and specific site key allocations.
                    required:
                      - shared_pool
                      - site_keys
                    properties:
                      shared_pool:
                        type: object
                        description: >-
                          The unassigned capacity available to all CLI users who
                          do not have a specific site key allocation.
                        required:
                          - allocation_bytes
                          - usage_bytes
                          - description
                        properties:
                          allocation_bytes:
                            type: integer
                            format: int64
                            description: >-
                              Total bytes available in the shared pool, which
                              equals to the value that remains when all site key
                              allocations are deducted from the total capacity
                              available for the CLI.
                            example: 53687091200
                          usage_bytes:
                            type: integer
                            format: int64
                            description: >-
                              Total bytes currently consumed by shared pool
                              users.
                            example: 2147483648
                          description:
                            type: string
                            description: A fixed label for the shared pool.
                            example: Shared Pool
                      site_keys:
                        type: array
                        description: List of specific site key allocations.
                        items:
                          type: object
                          required:
                            - site_key
                            - allocation_bytes
                            - usage_bytes
                            - deleted
                          properties:
                            site_key:
                              type: string
                              description: >-
                                A unique identifier for the site key. Site key
                                is associated with the [CLI
                                license](https://docs.secure.software/cli/licensing-guide#rl-secure-site-wide),
                                but is not tied to a specific machine. This
                                identifier always begins with `rlcli-`.
                              example: rlcli-0d4c691600f94dc80fba3a3ba344dd4d
                            allocation_bytes:
                              type: integer
                              format: int64
                              description: >-
                                Capacity reservation assigned to a specific site
                                key.
                              example: 1073741824
                            usage_bytes:
                              type: integer
                              format: int64
                              description: >-
                                Usage consumption by a specific site key in the
                                current month.
                              example: 52428800
                            deleted:
                              type: boolean
                              description: >-
                                Whether this allocation has been deleted. This
                                value resets at the beginning of the next month.
                              example: false
                            description:
                              type: string
                              description: >-
                                User-defined description for a specific site
                                key.
                              example: CI/CD Pipeline Key
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /usage/{organization}/{group}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
    get:
      operationId: listGroupUsage
      summary: Usage details for a group
      description: >-
        Return usage data for the specified organization and group.


        For an organization, next to the information tied to [analysis
        capacity](https://docs.secure.software/portal/analysis-capacity), there
        is an entire **Entitlements** section that allows you to check which
        [SAFE Assessment
        categories](https://docs.secure.software/portal/analysis-capacity#entitlements)
        are enabled for your ReversingLabs cloud account and are evaluated
        during software analysis. 

        If you're using both Portal and CLI, same entitlement restrictions apply
        to both products.


        If the user account does not have permission to access the specified
        group, the endpoint responds with an error.
      tags:
        - Group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - organization_usage
                  - group_usage
                properties:
                  organization_usage:
                    $ref: '#/components/schemas/OrganizationUsage'
                  group_usage:
                    type: object
                    required:
                      - projects_usage_bytes
                      - projects_usage_limit_bytes
                      - filestream_usage_bytes
                      - filestream_usage_limit_bytes
                    properties:
                      projects_usage_bytes:
                        $ref: '#/components/schemas/ProjectUsageBytes'
                      projects_usage_limit_bytes:
                        $ref: '#/components/schemas/ProjectUsageLimitBytes'
                      filestream_usage_bytes:
                        $ref: '#/components/schemas/FilestreamUsageBytes'
                      filestream_usage_limit_bytes:
                        $ref: '#/components/schemas/FilestreamUsageLimitBytes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /approve/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    put:
      operationId: approveVersion
      summary: Approve a version
      description: >-
        Set the approval status for the requested package version to
        **Approved**. The request will be successful only if the package version
        currently has one of the following approval statuses: *Approval
        Pending*, *Rejected*. Revoked package versions cannot be approved again.


        Your user account must have one of the following roles to be able to
        approve package versions: Organization Administrator, Organization
        Security, Group Owner.


        For auditing purposes, you can optionally specify the reason for
        approving the package version in the request body.


        By default, all package versions uploaded to the Portal have the
        *Approval Pending* status.       
      tags:
        - Approval
      requestBody:
        $ref: '#/components/requestBodies/ApproveRequest'
      responses:
        '200':
          description: Approved
          content:
            text/plain:
              example: Approved
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a version with the 'Undetermined' and 'Rejected'
                      approval statuses can be approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /reject/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    put:
      operationId: rejectVersion
      summary: Reject a version
      description: >-
        Set the approval status for the requested package version to
        **Rejected**. The request will be successful only if the package version
        currently has the *Approval Pending* status. Revoked package versions
        cannot have their status changed to *Rejected*.


        For auditing purposes, you can optionally specify the reason for
        rejecting the package version in the request body.


        Your user account must have one of the following roles to be able to
        reject package versions: Organization Administrator, Organization
        Security, Group Owner.
      tags:
        - Approval
      requestBody:
        $ref: '#/components/requestBodies/RejectRequest'
      responses:
        '200':
          description: Rejected approval
          content:
            text/plain:
              example: Rejected approval
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a version with the 'Undetermined' approval status can
                      be rejected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /revoke/{organization}/{group}/pkg:rl/{project}/{package}@{version}:
    parameters:
      - $ref: '#/components/parameters/organization'
      - $ref: '#/components/parameters/group'
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/package'
      - $ref: '#/components/parameters/version'
    put:
      operationId: revokeVersion
      summary: Revoke approval
      description: >-
        Set the approval status for the requested package version to
        **Revoked**. The request will be successful only if the package version
        currently has the *Approved* status. When the approval status is set to
        **Revoked**, you can no longer change it back to *Approved* or
        *Rejected*.


        For auditing purposes, you can optionally specify the reason for
        revoking approval in the request body.


        Your user account must have one of the following roles to be able to
        revoke approval for package versions: Organization Administrator,
        Organization Security, Group Owner.
      tags:
        - Approval
      requestBody:
        $ref: '#/components/requestBodies/RevokeRequest'
      responses:
        '200':
          description: Revoked approval
          content:
            text/plain:
              example: Revoked approval
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
              examples:
                IncorrectApprovalStatus:
                  value:
                    error: >-
                      Only a version with the 'Approved' approval status can be
                      revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /community/find/packages:
    post:
      security: []
      summary: Search for packages
      tags:
        - Community
      description: >-
        Search the Spectra Assure Community catalogue for information on one or
        more software packages specified in the request. The response contains
        the list of all software packages that match the search criteria.


        Enterprise users can search for a maximum of 50 packages per request.
        Users on the Free plan can search for a maximum of 5 packages per
        request.


        To search for a package, provide either of the following in the request
        body:


        - the correct **purl** (package URL) in the format
        `pkg:community/namespace/package@version`. The `version` part of the
        purl may be omitted. In that case, the API returns information about the
        latest published version of the software package. It's also possible to
        search for packages by partial purl with matching patterns and version
        expressions. **Maven package search does not support version
        expressions.**  


        - the package **hash** in the SHA1 or SHA256 format. When searching for
        packages by hash, the results will include packages with that hash as
        well as those that contain it. Note that hashes of embedded files are
        tracked only if they are malware artifacts.


        For more advanced search queries, the request body supports matching a
        range of package versions by a glob pattern or a community-specific
        version expression. It is also possible to search for artifacts by file
        name or tag, but only in software repositories (communities) that
        support multiple version artifacts for software packages.


        Every request must also contain a unique search identifier string that
        will be included in the response. The string value is arbitrary.


        To make integrations easier, you can use the `compact` query parameter
        in the request. This parameter instructs the API to return a simplified
        response in which all optional fields are automatically omitted.    
      operationId: postFindPackageMetadata
      requestBody:
        $ref: '#/components/requestBodies/json_search'
      parameters:
        - $ref: '#/components/parameters/query_offset'
        - $ref: '#/components/parameters/query_limit'
        - $ref: '#/components/parameters/is_compact'
      responses:
        '200':
          $ref: '#/components/responses/oss-search'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          $ref: '#/components/responses/low-capacity'
        '403':
          $ref: '#/components/responses/forbidden'
        '413':
          $ref: '#/components/responses/content-too-large'
        '429':
          $ref: '#/components/responses/too-many-requests'
        '500':
          $ref: '#/components/responses/server-error'
  /community/report/version/pkg:{community}/{namespace}/{package}@{version}:
    get:
      security: []
      summary: Show report for a package version
      tags:
        - Community
      description: >-
        This endpoint is used to retrieve detailed information about a software
        package version specified in the request. The response contains the
        Spectra Assure Community analysis report for the requested package
        version. Only one package version can be specified per request.  


        To successfully retrieve the information, you must specify the correct
        purl (package URL) by using the required path parameters. The `version`
        part of the purl may be omitted. In that case, the API returns
        information about the latest published version of the software package.


        Optionally, you can specify the artifact file(s) for which you want to
        retrieve the information with query parameters `artifact` and
        `artifact_tag`. Note that these parameters work only with software
        repositories that support multiple version artifacts for software
        packages.
      operationId: getCommunityVersionAssessment
      parameters:
        - $ref: '#/components/parameters/purl_community'
        - $ref: '#/components/parameters/purl_namespace'
        - $ref: '#/components/parameters/purl_package'
        - $ref: '#/components/parameters/purl_version'
        - $ref: '#/components/parameters/purl_artifact'
        - $ref: '#/components/parameters/purl_artifact_tag'
      responses:
        '200':
          $ref: '#/components/responses/oss-version'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          $ref: '#/components/responses/low-capacity'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '429':
          $ref: '#/components/responses/too-many-requests'
        '500':
          $ref: '#/components/responses/server-error'
  /community/report/package/pkg:{community}/{namespace}/{package}@{version}:
    get:
      security: []
      summary: Show details about a package
      tags:
        - Community
      description: >-
        This endpoint is used to retrieve detailed information about a software
        package specified in the request. By default, the response includes
        relevant package metadata and the information about the latest published
        version of the software package. 


        To include information about a specific package version in the response,
        you can use the `version` path parameter in the request. Multiple
        package versions can be targeted with optional query parameters
        `match_pattern` and `match_expression`. These parameters are mutually
        exclusive (cannot be used together in a single request) and incompatible
        with the `version` parameter.


        To successfully show the software package information, the purl (package
        URL) must be correctly specified by using the required path parameters.


        Optionally, you can specify the artifact file(s) for which you want to
        retrieve the information with query parameters `artifact` and
        `artifact_tag`. Note that these parameters work only with software
        repositories that support multiple version artifacts for software
        packages.
      operationId: getCommunityPackageMetadata
      parameters:
        - $ref: '#/components/parameters/purl_community'
        - $ref: '#/components/parameters/purl_namespace'
        - $ref: '#/components/parameters/purl_package'
        - $ref: '#/components/parameters/purl_version'
        - $ref: '#/components/parameters/purl_artifact'
        - $ref: '#/components/parameters/purl_artifact_tag'
        - $ref: '#/components/parameters/match_pattern'
        - $ref: '#/components/parameters/match_expression'
        - $ref: '#/components/parameters/query_offset'
        - $ref: '#/components/parameters/query_limit'
      responses:
        '200':
          $ref: '#/components/responses/oss-package'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          $ref: '#/components/responses/low-capacity'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '429':
          $ref: '#/components/responses/too-many-requests'
        '500':
          $ref: '#/components/responses/server-error'
  /community/user/account:
    get:
      security: []
      summary: View Community user account details
      tags:
