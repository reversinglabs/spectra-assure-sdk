        `build` query parameter set to the `repro` value to remove only that
        artifact without removing anything else. In this case, the main package
        version artifact and its metadata will be preserved.


        To preserve analysis reports for the package version, use the **Export
        analysis report** endpoint to download the reports before deleting the
        version. 


        Only one package version can be deleted per request.
